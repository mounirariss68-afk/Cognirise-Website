<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t1">Guardrails govern the agent. The Agent Authority Model governs the handover.</title>
  <desc id="d1">Two panels. On the left, a single clinic agent sits inside one perimeter of guardrails, and all four of its acts — answering a question, booking, cancelling and refunding — leave with the same authority, so the riskiest inherits the posture of the safest. On the right, the same four acts are governed separately as handovers, each with its own type, exposure rating and authority level, ranging from out of the loop for answering a question to in the loop for issuing a refund.</desc>

  <defs>
    
    
  </defs>

  <rect width="1200" height="700" fill="#FFFFFF"/>

  
  <rect x="24" y="24" width="546" height="652" rx="14" fill="#F9F7F4" stroke="#CBD3E1"/>
  <text x="52" y="70" font-size="13" font-weight="600" fill="#FF775C" letter-spacing="1.6">THE COMMON PATTERN</text>
  <text x="52" y="104" font-size="23" font-weight="600" fill="#102957" font-family="Comfortaa, Inter, sans-serif">Guardrails govern the agent</text>
  <text x="52" y="132" font-size="14.5" fill="#60708D">One filter. One prompt. One limit. Applied to everything it does.</text>

  
  <rect x="64" y="164" width="466" height="120" rx="12" fill="none" stroke="#FF775C" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="80" y="188" font-size="11.5" font-weight="600" fill="#FF775C" letter-spacing="1.2">GUARDRAIL PERIMETER</text>
  <rect x="176" y="200" width="242" height="66" rx="10" fill="#102957"/>
  <text x="297" y="230" font-size="15.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Front-Desk Agent</text>
  <text x="297" y="252" font-size="12.5" fill="#DCE4F0" text-anchor="middle">one autonomy setting</text>

  
  <g font-size="14" fill="#102957">
    <g>
      <line x1="297" y1="266" x2="297" y2="312" stroke="#8A93A0" stroke-width="1.4"/>
      <line x1="150" y1="312" x2="444" y2="312" stroke="#8A93A0" stroke-width="1.4"/>
    </g>
    <g stroke="#8A93A0" stroke-width="1.4">
      <line x1="150" y1="312" x2="150" y2="344"/>
      <line x1="248" y1="312" x2="248" y2="344"/>
      <line x1="346" y1="312" x2="346" y2="344"/>
      <line x1="444" y1="312" x2="444" y2="344"/>
    </g>
  </g>

  <g>
    <rect x="64" y="352" width="466" height="42" rx="8" fill="#FFFFFF" stroke="#CBD3E1"/>
    <text x="84" y="378" font-size="14.5" fill="#102957">Answer a clinic question</text>
    <text x="510" y="378" font-size="12.5" fill="#8A93A0" text-anchor="end">same authority</text>
  </g>
  <g>
    <rect x="64" y="402" width="466" height="42" rx="8" fill="#FFFFFF" stroke="#CBD3E1"/>
    <text x="84" y="428" font-size="14.5" fill="#102957">Book an appointment</text>
    <text x="510" y="428" font-size="12.5" fill="#8A93A0" text-anchor="end">same authority</text>
  </g>
  <g>
    <rect x="64" y="452" width="466" height="42" rx="8" fill="#FFFFFF" stroke="#CBD3E1"/>
    <text x="84" y="478" font-size="14.5" fill="#102957">Cancel an appointment</text>
    <text x="510" y="478" font-size="12.5" fill="#8A93A0" text-anchor="end">same authority</text>
  </g>
  <g>
    <rect x="64" y="502" width="466" height="42" rx="8" fill="#FFF3EF" stroke="#FF775C"/>
    <text x="84" y="528" font-size="14.5" font-weight="600" fill="#102957">Issue a refund</text>
    <text x="510" y="528" font-size="12.5" font-weight="600" fill="#FF775C" text-anchor="end">same authority</text>
  </g>

  <line x1="64" y1="572" x2="530" y2="572" stroke="#CBD3E1"/>
  <text x="64" y="600" font-size="14.5" font-weight="600" fill="#FF775C">The riskiest act inherits the posture of the safest.</text>
  <text x="64" y="626" font-size="13.5" fill="#60708D">Governance attaches to the wrong object, so the refund is</text>
  <text x="64" y="646" font-size="13.5" fill="#60708D">protected exactly as well as the opening-hours question.</text>

  
  <rect x="630" y="24" width="546" height="652" rx="14" fill="#FFFFFF" stroke="#102957" stroke-width="1.4"/>
  <text x="658" y="70" font-size="13" font-weight="600" fill="#DB509E" letter-spacing="1.6">THE AGENT AUTHORITY MODEL</text>
  <text x="658" y="104" font-size="23" font-weight="600" fill="#102957" font-family="Comfortaa, Inter, sans-serif">Authority governs the handover</text>
  <text x="658" y="132" font-size="14.5" fill="#60708D">Each moment the output leaves the agent is governed on its own.</text>

  <rect x="782" y="200" width="242" height="66" rx="10" fill="#102957"/>
  <text x="903" y="230" font-size="15.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Front-Desk Agent</text>
  <text x="903" y="252" font-size="12.5" fill="#DCE4F0" text-anchor="middle">four handovers, four profiles</text>

  <g>
    <line x1="903" y1="266" x2="903" y2="312" stroke="#102957" stroke-width="1.4"/>
    <line x1="756" y1="312" x2="1050" y2="312" stroke="#102957" stroke-width="1.4"/>
    <g stroke="#102957" stroke-width="1.4">
      <line x1="756" y1="312" x2="756" y2="344"/>
      <line x1="854" y1="312" x2="854" y2="344"/>
      <line x1="952" y1="312" x2="952" y2="344"/>
      <line x1="1050" y1="312" x2="1050" y2="344"/>
    </g>
  </g>

  <g>
    <rect x="670" y="352" width="466" height="42" rx="8" fill="#FFFFFF" stroke="#CBD3E1"/>
    <rect x="670" y="352" width="4" height="42" rx="2" fill="#4A76F5"/>
    <text x="690" y="371" font-size="14.5" fill="#102957">Answer a clinic question</text>
    <text x="690" y="388" font-size="11.5" fill="#8A93A0">Knowledge · R1 / H1</text>
    <text x="1116" y="380" font-size="13" font-weight="600" fill="#4A76F5" text-anchor="end">out of the loop</text>
  </g>
  <g>
    <rect x="670" y="402" width="466" height="42" rx="8" fill="#FFFFFF" stroke="#CBD3E1"/>
    <rect x="670" y="402" width="4" height="42" rx="2" fill="#60708D"/>
    <text x="690" y="421" font-size="14.5" fill="#102957">Book an appointment</text>
    <text x="690" y="438" font-size="11.5" fill="#8A93A0">Action · R2 / H2</text>
    <text x="1116" y="430" font-size="13" font-weight="600" fill="#60708D" text-anchor="end">on the loop</text>
  </g>
  <g>
    <rect x="670" y="452" width="466" height="42" rx="8" fill="#FFFFFF" stroke="#CBD3E1"/>
    <rect x="670" y="452" width="4" height="42" rx="2" fill="#60708D"/>
    <text x="690" y="471" font-size="14.5" fill="#102957">Cancel an appointment</text>
    <text x="690" y="488" font-size="11.5" fill="#8A93A0">Action · R3 / H2 · defined intervention window</text>
    <text x="1116" y="480" font-size="13" font-weight="600" fill="#60708D" text-anchor="end">on the loop</text>
  </g>
  <g>
    <rect x="670" y="502" width="466" height="42" rx="8" fill="#FDF2F8" stroke="#DB509E"/>
    <rect x="670" y="502" width="4" height="42" rx="2" fill="#DB509E"/>
    <text x="690" y="521" font-size="14.5" font-weight="600" fill="#102957">Issue a refund</text>
    <text x="690" y="538" font-size="11.5" fill="#8A93A0">Action · R4 / H3</text>
    <text x="1116" y="530" font-size="13" font-weight="600" fill="#DB509E" text-anchor="end">in the loop</text>
  </g>

  <line x1="670" y1="572" x2="1136" y2="572" stroke="#CBD3E1"/>
  <text x="670" y="600" font-size="14.5" font-weight="600" fill="#102957">Authority attaches to the tool, not the agent.</text>
  <text x="670" y="626" font-size="13.5" fill="#60708D">Same agent, same model, same guardrail technology — but the</text>
  <text x="670" y="646" font-size="13.5" fill="#60708D">refund is now governed as a refund.</text>
</svg>