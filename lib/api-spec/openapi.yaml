      properties:
        id: { type: string }
        kind:
          $ref: "#/components/schemas/SubmissionKind"
        name: { type: ["string", "null"] }
        email: { type: string, pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$' }
        organization: { type: ["string", "null"] }
        role: { type: ["string", "null"] }
        market: { type: string }
        processArea: { type: ["string", "null"] }
        challenge: { type: ["string", "null"] }
        status:
          $ref: "#/components/schemas/SubmissionStatus"
        ownerId: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        sourcePage: { type: string }
        consent: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SubmissionUpdate:
      type: object
      additionalProperties: false
      properties:
        status:
          $ref: "#/components/schemas/SubmissionStatus"
        ownerId: { type: ["string", "null"] }
        notes: { type: ["string", "null"], maxLength: 4000 }
    SubmissionExportInput:
      type: object
      additionalProperties: false
      required: [format]
      properties:
        format: { type: string, enum: [csv] }
        kind:
          $ref: "#/components/schemas/SubmissionKind"
        status:
          $ref: "#/components/schemas/SubmissionStatus"
        market: { type: string }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
    SubmissionExport:
      type: object
      required: [id, status, expiresAt]
      properties:
        id: { type: string }
        status: { type: string, enum: [queued, ready] }
        downloadUrl: { type: ["string", "null"] }
        expiresAt: { type: string, format: date-time }
    SubmissionPage:
      allOf:
        - $ref: "#/components/schemas/PageMetadata"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Submission"

    UserRole:
      type: string
      enum: [administrator, publisher, editor, viewer]
    UserStatus:
      type: string
      enum: [invited, active, suspended]
    User:
      type: object
      required: [id, name, email, role, status, mfaEnabled, mustRotate, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$' }
        role:
          $ref: "#/components/schemas/UserRole"
        status:
          $ref: "#/components/schemas/UserStatus"
        mfaEnabled: { type: boolean }
        mustRotate: { type: boolean }
        lastLoginAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    UserInvitationInput:
      type: object
      additionalProperties: false
      required: [name, email, role]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$', maxLength: 254 }
        role:
          $ref: "#/components/schemas/UserRole"
    UserInvitation:
      type: object
      required: [id, user, temporaryPassword, expiresAt, createdAt]
      properties:
        id: { type: string }
        user:
          $ref: "#/components/schemas/User"
        temporaryPassword:
          type: string
          description: One-time credential to copy securely to the invited user.
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    UserUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        role:
          $ref: "#/components/schemas/UserRole"
        status:
          $ref: "#/components/schemas/UserStatus"
    UserCredentialUpdate:
      type: object
      additionalProperties: false
      required: [userId, temporaryPassword]
      properties:
        userId: { type: string }
        temporaryPassword:
          type: string
          minLength: 12
          maxLength: 128
          pattern: '^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).+$'
    PasswordChangeInput:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 128
        newPassword:
          type: string
          minLength: 12
          maxLength: 128
    PasswordResetInput:
      type: object
      additionalProperties: false
      properties:
        sendEmail: { type: boolean, default: true }
    PasswordReset:
      type: object
      required: [id, temporaryPassword, expiresAt]
      properties:
        id: { type: string }
        temporaryPassword:
          type: string
          description: One-time credential to copy securely to the user.
        expiresAt: { type: string, format: date-time }
    SessionRevocationInput:
      type: object
      additionalProperties: false
      properties:
        exceptCurrent: { type: boolean, default: false }
    SessionRevocation:
      type: object
      required: [revokedCount, revokedAt]
      properties:
        revokedCount: { type: number, multipleOf: 1, minimum: 0 }
        revokedAt: { type: string, format: date-time }
    UserPage:
      allOf:
        - $ref: "#/components/schemas/PageMetadata"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/User"

    AuditEvent:
      type: object
      required: [id, action, entityType, entityId, metadata, createdAt]
      properties:
        id: { type: string }
        actor:
          anyOf:
            - $ref: "#/components/schemas/AuditActor"
