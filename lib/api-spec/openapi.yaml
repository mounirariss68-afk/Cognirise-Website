      type: object
      additionalProperties: false
      required: [choice]
      anyOf:
        - required: [conflictId]
        - required: [path]
      properties:
        conflictId: { type: string, minLength: 1, description: Required by current clients; identifies exactly one conflicting sparse operation. }
        path: { type: string, minLength: 1 }
        choice:
          type: string
          enum: [shared, market]
    SharedMarketBaselineInput:
      type: object
      additionalProperties: false
      required: [locale, snapshot]
      properties:
        locale: { type: string, pattern: '^[a-z]{2}(?:-[A-Z]{2})?$', minLength: 2, maxLength: 16 }
        sourceRevisionId: { type: ["string", "null"], description: Exact real-market source revision for legacy baseline establishment; omit for a successor of an existing neutral baseline. }
        snapshot: { type: object, additionalProperties: true }
        expectedRevisionNumber: { type: number, multipleOf: 1, minimum: 1 }
    SharedMarketBaseline:
      type: object
      required: [id, documentId, locale, revisionId, revisionNumber, sourceRevisionId, snapshot, mediaReferences, createdAt]
      properties:
        id: { type: string }
        documentId: { type: string }
        locale: { type: string }
        revisionId: { type: string }
        revisionNumber: { type: number, multipleOf: 1 }
        sourceRevisionId: { type: ["string", "null"] }
        snapshot: { type: object, additionalProperties: true }
        mediaReferences: { type: array, items: { type: object, additionalProperties: true } }
        createdAt: { type: string, format: date-time }
    SharedMarketBindingInput:
      type: object
      additionalProperties: false
      required: [marketEditionId, locale, mode, version]
      properties:
        marketEditionId: { type: string }
        locale: { type: string, minLength: 2, maxLength: 16 }
        mode: { $ref: "#/components/schemas/SharedMarketBindingMode" }
        baselineId: { type: string }
        baselineRevisionId: { type: string, description: Required for Shared and Adapted bindings; freezes the exact neutral revision. }
        independentRevisionId: { type: string, description: Required for Independent bindings; must be an exact saved destination revision. }
        expectedDestinationRevisionId: { type: ["string", "null"], description: Required for every Shared or Adapted operation that materializes a destination draft. Exact destination revision inspected before reuse; null asserts that no saved exact destination existed. Translation-lineage acknowledgements that do not materialize remain compatible without it. }
        expectedActiveBaselineRevisionId: { type: string, description: Required for every Shared or Adapted operation that materializes a destination draft. Active frozen baseline revision inspected before reuse; the binding fails if that baseline has a successor. Translation-lineage acknowledgements that do not materialize remain compatible without it. }
