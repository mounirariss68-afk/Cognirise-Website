openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: First-party Cognirise website and mini CMS API.
servers:
  - url: /api
    description: Base API path
tags:
  - { name: health, description: Health operations }
  - { name: enquiries, description: Website enquiry and subscription operations }
  - { name: auth, description: First-party administrator authentication }
  - { name: dashboard, description: CMS dashboard }
  - { name: documents, description: Governed CMS documents }
  - { name: markets, description: Market editions }
  - { name: media, description: Media library }
  - { name: submissions, description: Website submissions }
  - { name: users, description: CMS users }
  - { name: audit, description: Audit trail }
  - { name: public, description: Published public content }
  - { name: analytics, description: First-party analytics and consent }
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /enquiries:
    post:
      operationId: submitEnquiry
      tags: [enquiries]
      summary: Submit a Cognirise website enquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnquiryInput"
      responses:
        "201":
          description: Enquiry accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnquiryReceipt"
        "400":
          $ref: "#/components/responses/BadRequest"
  /newsletter-subscriptions:
    post:
      operationId: subscribeNewsletter
      tags: [enquiries]
      summary: Subscribe to Cognirise field notes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsletterSubscriptionInput"
      responses:
        "201":
          description: Subscription accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionReceipt"
        "400":
          $ref: "#/components/responses/BadRequest"

  /auth/bootstrap:
    get:
      operationId: getAuthBootstrap
      tags: [auth]
      summary: Get initial account setup state
      responses:
        "200":
          description: Bootstrap state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthBootstrap"
    post:
      operationId: bootstrapAuth
      tags: [auth]
      summary: Create the initial administrator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthBootstrapInput"
      responses:
        "201":
          description: Administrator and session created
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Authenticate with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login result or MFA challenge
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/mfa/verify:
    post:
      operationId: verifyMfa
      tags: [auth]
      summary: Complete an MFA challenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaVerificationInput"
      responses:
        "200":
          description: Authenticated session
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/mfa/setup:
    post:
      operationId: setupMfa
      tags: [auth]
      summary: Start TOTP MFA enrollment
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        "200":
          description: Time-limited MFA provisioning details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaSetup"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/mfa/confirm:
    post:
      operationId: confirmMfa
      tags: [auth]
      summary: Confirm TOTP MFA enrollment
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaConfirmationInput"
      responses:
        "200":
          description: MFA enabled and recovery codes issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaConfirmation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/recovery:
    post:
      operationId: recoverAuth
      tags: [auth]
      summary: Authenticate using a recovery code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoveryInput"
      responses:
        "200":
          description: Authenticated session
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/password-reset:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Set a temporary password for a CMS user
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCredentialUpdate"
      responses:
        "200":
          description: User password reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/password-change:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change the current user's password
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeInput"
      responses:
        "204":
          description: Password changed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        "204":
          description: Session ended
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/session:
    get:
      operationId: getSession
      tags: [auth]
      summary: Get the current session
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/csrf:
    get:
      operationId: getCsrfToken
      tags: [auth]
      summary: Issue a CSRF token for the current session
      security:
        - cookieAuth: []
      responses:
        "200":
          description: CSRF token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfToken"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /dashboard/kpis:
    get:
      operationId: getDashboardKpis
      tags: [dashboard]
      summary: Get editorial and submission KPIs
      security:
        - cookieAuth: []
      parameters:
        - name: period
          in: query
          schema:
            $ref: "#/components/schemas/DashboardPeriod"
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Dashboard KPIs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardKpis"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: List CMS documents
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - name: kind
          in: query
          schema:
            $ref: "#/components/schemas/DocumentKind"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/DocumentStatus"
        - name: market
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Paginated documents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createDocument
      tags: [documents]
      summary: Create a document
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentInput"
      responses:
        "201":
          description: Document created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          $ref: "#/components/responses/BadRequest"
  /documents/{documentId}:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      operationId: getDocument
      tags: [documents]
      summary: Get a document
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateDocument
      tags: [documents]
      summary: Update a draft document
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentUpdate"
      responses:
        "200":
          description: Document updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteDocument
      tags: [documents]
      summary: Permanently delete an eligible document
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        "204":
          description: Document deleted
        "409":
          $ref: "#/components/responses/Conflict"
  /documents/{documentId}/revisions:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      operationId: listDocumentRevisions
      tags: [documents]
      summary: List document revisions
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Paginated revisions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentRevisionPage"
  /documents/{documentId}/revisions/{revisionId}:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/RevisionId"
    get:
      operationId: getDocumentRevision
      tags: [documents]
      summary: Get a document revision
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentRevision"
        "404":
          $ref: "#/components/responses/NotFound"
  /documents/{documentId}/submit:
    post:
      operationId: submitDocument
      tags: [documents]
      summary: Submit a document for review
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewSubmissionInput"
      responses:
        "200":
          description: Document submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "409":
          $ref: "#/components/responses/Conflict"
  /documents/{documentId}/publish:
    post:
      operationId: publishDocument
      tags: [documents]
      summary: Publish or schedule a document
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicationInput"
      responses:
        "200":
          description: Publication accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "409":
          $ref: "#/components/responses/Conflict"
  /documents/{documentId}/rollback:
    post:
      operationId: rollbackDocument
      tags: [documents]
      summary: Restore a prior revision as a new draft
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RollbackInput"
      responses:
        "200":
          description: Restored draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "409":
          $ref: "#/components/responses/Conflict"
  /documents/{documentId}/archive:
    post:
      operationId: archiveDocument
      tags: [documents]
      summary: Archive a document
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveInput"
      responses:
        "200":
          description: Archived document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
  /documents/{documentId}/preview:
    get:
      operationId: previewDocument
      tags: [documents]
      summary: Get a time-limited preview
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Renderable preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentPreview"

  /market-editions:
    get:
      operationId: listMarketEditions
      tags: [markets]
      summary: List market editions
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated market editions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketEditionPage"
    post:
      operationId: createMarketEdition
      tags: [markets]
      summary: Create a market edition
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketEditionInput"
      responses:
        "201":
          description: Market edition created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketEdition"
  /market-editions/{marketEditionId}:
    parameters:
      - $ref: "#/components/parameters/MarketEditionId"
    get:
      operationId: getMarketEdition
      tags: [markets]
      summary: Get a market edition
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Market edition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketEdition"
    patch:
      operationId: updateMarketEdition
      tags: [markets]
      summary: Update a market edition
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketEditionUpdate"
      responses:
        "200":
          description: Market edition updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketEdition"
    delete:
      operationId: deleteMarketEdition
      tags: [markets]
      summary: Delete a market edition
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        "204":
          description: Market edition deleted

  /media:
    get:
      operationId: listMedia
      tags: [media]
      summary: List media metadata
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - name: mimeType
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Paginated media
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaAssetPage"
  /media/upload-requests:
    post:
      operationId: requestMediaUpload
      tags: [media]
      summary: Request a direct upload target
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaUploadInput"
      responses:
        "201":
          description: Upload target created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaUpload"
  /media/{mediaId}:
    parameters:
      - $ref: "#/components/parameters/MediaId"
    get:
      operationId: getMedia
      tags: [media]
      summary: Get media metadata
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Media asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaAsset"
    patch:
      operationId: updateMedia
      tags: [media]
      summary: Update media metadata
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaUpdate"
      responses:
        "200":
          description: Media updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaAsset"
    delete:
      operationId: deleteMedia
      tags: [media]
      summary: Delete unused media
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        "204":
          description: Media deleted
        "409":
          $ref: "#/components/responses/Conflict"
  /media/{mediaId}/finalize:
    post:
      operationId: finalizeMediaUpload
      tags: [media]
      summary: Validate and finalize an uploaded object
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/MediaId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaFinalizeInput"
      responses:
        "200":
          description: Finalized media
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaAsset"
        "409":
          $ref: "#/components/responses/Conflict"

  /submissions:
    get:
      operationId: listSubmissions
      tags: [submissions]
      summary: List enquiries and newsletter subscriptions
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - name: kind
          in: query
          schema:
            $ref: "#/components/schemas/SubmissionKind"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/SubmissionStatus"
        - name: market
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Paginated submissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionPage"
  /submissions/export:
    post:
      operationId: exportSubmissions
      tags: [submissions]
      summary: Export filtered submissions
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmissionExportInput"
      responses:
        "202":
          description: Export prepared or queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionExport"
  /submissions/{submissionId}:
    patch:
      operationId: updateSubmission
      tags: [submissions]
      summary: Update submission workflow state
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/SubmissionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmissionUpdate"
      responses:
        "200":
          description: Submission updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List CMS users
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - name: role
          in: query
          schema:
            $ref: "#/components/schemas/UserRole"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/UserStatus"
      responses:
        "200":
          description: Paginated users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPage"
  /users/invitations:
    post:
      operationId: inviteUser
      tags: [users]
      summary: Invite a CMS user
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInvitationInput"
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInvitation"
        "409":
          $ref: "#/components/responses/Conflict"
  /users/{userId}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update user role or status
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /users/{userId}/password-reset:
    post:
      operationId: resetUserPassword
      tags: [users]
      summary: Issue a password reset
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetInput"
      responses:
        "202":
          description: Password reset issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordReset"
  /users/{userId}/sessions/revoke:
    post:
      operationId: revokeUserSessions
      tags: [users]
      summary: Revoke a user's active sessions
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionRevocationInput"
      responses:
        "200":
          description: Sessions revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRevocation"

  /audit:
    get:
      operationId: listAuditEvents
      tags: [audit]
      summary: List immutable audit events
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: actorId
          in: query
          schema: { type: string }
        - name: entityType
          in: query
          schema: { type: string }
        - name: entityId
          in: query
          schema: { type: string }
        - name: action
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Paginated audit events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventPage"

  /public/content:
    get:
      operationId: listPublishedContent
      tags: [public]
      summary: List published content
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: kind
          in: query
          schema:
            $ref: "#/components/schemas/DocumentKind"
        - name: market
          in: query
          required: true
          schema: { type: string }
        - name: locale
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Paginated published content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishedContentPage"
  /public/content/{market}/{locale}/{kind}/{slug}:
    get:
      operationId: getPublishedContent
      tags: [public]
      summary: Get published content by kind and slug
      parameters:
        - name: market
          in: path
          required: true
          schema: { type: string }
        - name: locale
          in: path
          required: true
          schema: { type: string }
        - name: kind
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/DocumentKind"
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Published content
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishedContent"
        "404":
          $ref: "#/components/responses/NotFound"
  /public/sitemap:
    get:
      operationId: getPublicSitemap
      tags: [public]
      summary: Get public sitemap entries
      parameters:
        - name: market
          in: query
          schema: { type: string }
        - name: locale
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Sitemap entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sitemap"

  /analytics/events:
    post:
      operationId: recordAnalyticsEvent
      tags: [analytics]
      summary: Record a consent-aware first-party event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyticsEventInput"
      responses:
        "202":
          description: Event accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsReceipt"
        "400":
          $ref: "#/components/responses/BadRequest"
  /analytics/consent:
    post:
      operationId: recordAnalyticsConsent
      tags: [analytics]
      summary: Record a visitor's consent choices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentInput"
      responses:
        "200":
          description: Consent recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentRecord"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: cognirise_session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
  parameters:
    Page:
      name: page
      in: query
      schema: { type: number, multipleOf: 1, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: number, multipleOf: 1, minimum: 1, maximum: 100, default: 25 }
    Search:
      name: search
      in: query
      schema: { type: string, maxLength: 200 }
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string }
    RevisionId:
      name: revisionId
      in: path
      required: true
      schema: { type: string }
    MarketEditionId:
      name: marketEditionId
      in: path
      required: true
      schema: { type: string }
    MediaId:
      name: mediaId
      in: path
      required: true
      schema: { type: string }
    SubmissionId:
      name: submissionId
      in: path
      required: true
      schema: { type: string }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: Authentication required or failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: Resource state conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    ApiError:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code: { type: string }
        details:
          type: object
          additionalProperties: true
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    EnquiryInput:
      type: object
      additionalProperties: false
      required: [name, email, organization, market, processArea, challenge, consent, sourcePage]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        email:
          type: string
          pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
          maxLength: 254
        organization: { type: string, minLength: 2, maxLength: 160 }
        role: { type: string, maxLength: 120 }
        market:
          type: string
          enum: [uae, ksa, turkiye, europe]
        processArea: { type: string, maxLength: 120 }
        challenge: { type: string, minLength: 20, maxLength: 2000 }
        consent: { type: boolean, const: true }
        sourcePage: { type: string, minLength: 1, maxLength: 200 }
        website:
          type: string
          maxLength: 0
          description: Honeypot field that must remain empty.
    EnquiryReceipt:
      type: object
      required: [id, status, createdAt]
      properties:
        id: { type: string }
        status: { type: string, enum: [received] }
        createdAt: { type: string, format: date-time }
    NewsletterSubscriptionInput:
      type: object
      additionalProperties: false
      required: [email, market, consent, sourcePage]
      properties:
        email:
          type: string
          pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
          maxLength: 254
        market:
          type: string
          enum: [uae, ksa, turkiye, europe]
        consent: { type: boolean, const: true }
        sourcePage: { type: string, minLength: 1, maxLength: 200 }
        website:
          type: string
          maxLength: 0
          description: Honeypot field that must remain empty.
    SubscriptionReceipt:
      type: object
      required: [id, status, createdAt]
      properties:
        id: { type: string }
        status: { type: string, enum: [subscribed] }
        createdAt: { type: string, format: date-time }

    AuthBootstrap:
      type: object
      required: [setupRequired]
      properties:
        setupRequired: { type: boolean }
        csrfToken: { type: ["string", "null"] }
        session:
          anyOf:
            - $ref: "#/components/schemas/Session"
            - type: "null"
    AuthBootstrapInput:
      type: object
      additionalProperties: false
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$', maxLength: 254 }
        password: { type: string, minLength: 12, maxLength: 128 }
        mfaCode: { type: string, pattern: '^[0-9]{6}$' }
    LoginInput:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$', maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 128 }
    MfaVerificationInput:
      type: object
      additionalProperties: false
      required: [challengeId, code]
      properties:
        challengeId: { type: string }
        code: { type: string, pattern: '^[0-9]{6}$' }
    MfaSetup:
      type: object
      required: [secret, provisioningUri, expiresAt]
      properties:
        secret:
          type: string
          pattern: '^[A-Z2-7]+$'
          description: Base32-encoded TOTP secret. Display once and do not persist client-side.
        provisioningUri:
          type: string
          description: otpauth provisioning URI for a TOTP authenticator.
        expiresAt: { type: string, format: date-time }
    MfaConfirmationInput:
      type: object
      additionalProperties: false
      required: [secret, code]
      properties:
        secret:
          type: string
          pattern: '^[A-Z2-7]+$'
        code: { type: string, pattern: '^[0-9]{6}$' }
    MfaConfirmation:
      allOf:
        - $ref: "#/components/schemas/AuthResult"
        - type: object
          required: [recoveryCodes]
          properties:
            recoveryCodes:
              type: array
              minItems: 1
              items:
                type: string
                pattern: '^[A-Z0-9]{4,}(?:-[A-Z0-9]{4,})*$'
    RecoveryInput:
      type: object
      additionalProperties: false
      required: [email, recoveryCode]
      properties:
        email: { type: string, pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$', maxLength: 254 }
        recoveryCode:
          type: string
          minLength: 8
          maxLength: 64
    AuthResult:
      type: object
      required: [authenticated]
      properties:
        authenticated: { type: boolean }
        session:
          anyOf:
            - $ref: "#/components/schemas/Session"
            - type: "null"
        mfaChallenge:
          anyOf:
            - $ref: "#/components/schemas/MfaChallenge"
            - type: "null"
        csrfToken: { type: ["string", "null"] }
    MfaChallenge:
      type: object
      required: [id, expiresAt]
      properties:
        id: { type: string }
        method: { type: string, enum: [totp] }
        expiresAt: { type: string, format: date-time }
    Session:
      type: object
      required: [id, user, expiresAt]
      properties:
        id: { type: string }
        user:
          $ref: "#/components/schemas/User"
        mfaVerified: { type: boolean }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    CsrfToken:
      type: object
      required: [token, expiresAt]
      properties:
        token: { type: string }
        expiresAt: { type: string, format: date-time }

    DashboardKpis:
      type: object
      required:
        - documents
        - submissions
        - users
        - analytics
        - contentAwaitingReview
        - overdueContentReview
        - publishActivity
        - publishFailures
        - definition
        - timezone
        - period
        - generatedAt
      properties:
        documents:
          $ref: "#/components/schemas/DocumentKpis"
        submissions:
          $ref: "#/components/schemas/SubmissionKpis"
        users:
          $ref: "#/components/schemas/UserKpis"
        analytics:
          $ref: "#/components/schemas/DashboardAnalytics"
        contentAwaitingReview: { type: number, multipleOf: 1, minimum: 0 }
        overdueContentReview: { type: number, multipleOf: 1, minimum: 0 }
        publishActivity: { type: number, multipleOf: 1, minimum: 0 }
        publishFailures: { type: number, multipleOf: 1, minimum: 0 }
        definition:
          type: string
          description: Human-readable metric definition and attribution basis.
        timezone: { type: string }
        period:
          $ref: "#/components/schemas/DashboardPeriod"
        from: { type: ["string", "null"], format: date-time }
        to: { type: ["string", "null"], format: date-time }
        generatedAt: { type: string, format: date-time }
    DashboardPeriod:
      type: string
      enum: [7d, 30d, 90d, custom]
    DashboardAnalytics:
      type: object
      required:
        - sessions
        - pageViews
        - topPages
        - marketMix
        - sources
        - ctaClicks
        - valueScanSubmissions
        - newsletterSubscriptions
        - ctaConversionRate
        - newsletterConversionRate
        - publicationViews
        - coreWebVitals
      properties:
        sessions: { type: number, multipleOf: 1, minimum: 0 }
        pageViews: { type: number, multipleOf: 1, minimum: 0 }
        topPages:
          type: array
          items:
            $ref: "#/components/schemas/PageMetric"
        marketMix:
          type: array
          items:
            $ref: "#/components/schemas/MarketMetric"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceMetric"
        ctaClicks: { type: number, multipleOf: 1, minimum: 0 }
        valueScanSubmissions: { type: number, multipleOf: 1, minimum: 0 }
        newsletterSubscriptions: { type: number, multipleOf: 1, minimum: 0 }
        ctaConversionRate: { type: number, minimum: 0, maximum: 1 }
        newsletterConversionRate: { type: number, minimum: 0, maximum: 1 }
        publicationViews: { type: number, multipleOf: 1, minimum: 0 }
        coreWebVitals:
          $ref: "#/components/schemas/CoreWebVitals"
    PageMetric:
      type: object
      required: [path, count]
      properties:
        path: { type: string }
        count: { type: number, multipleOf: 1, minimum: 0 }
    MarketMetric:
      type: object
      required: [market, count]
      properties:
        market: { type: string }
        count: { type: number, multipleOf: 1, minimum: 0 }
    SourceMetric:
      type: object
      required: [source, count]
      properties:
        source: { type: string }
        count: { type: number, multipleOf: 1, minimum: 0 }
    CoreWebVitals:
      type: object
      required: [lcp, inp, cls]
      properties:
        lcp: { type: ["number", "null"], minimum: 0 }
        inp: { type: ["number", "null"], minimum: 0 }
        cls: { type: ["number", "null"], minimum: 0 }
    DocumentKpis:
      type: object
      required: [draft, inReview, scheduled, published, archived]
      properties:
        draft: { type: number, multipleOf: 1, minimum: 0 }
        inReview: { type: number, multipleOf: 1, minimum: 0 }
        scheduled: { type: number, multipleOf: 1, minimum: 0 }
        published: { type: number, multipleOf: 1, minimum: 0 }
        archived: { type: number, multipleOf: 1, minimum: 0 }
    SubmissionKpis:
      type: object
      required: [new, open, last30Days]
      properties:
        new: { type: number, multipleOf: 1, minimum: 0 }
        open: { type: number, multipleOf: 1, minimum: 0 }
        last30Days: { type: number, multipleOf: 1, minimum: 0 }
    UserKpis:
      type: object
      required: [active, invited]
      properties:
        active: { type: number, multipleOf: 1, minimum: 0 }
        invited: { type: number, multipleOf: 1, minimum: 0 }

    DocumentKind:
      type: string
      enum: [person, partner, platform, publication, case-study]
    DocumentStatus:
      type: string
      enum: [draft, in-review, approved, scheduled, published, archived]
    Document:
      type: object
      required: [id, kind, slug, title, status, content, markets, revisionNumber, createdAt, updatedAt]
      properties:
        id: { type: string }
        kind:
          $ref: "#/components/schemas/DocumentKind"
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        title: { type: string }
        summary: { type: ["string", "null"] }
        status:
          $ref: "#/components/schemas/DocumentStatus"
        content:
          type: object
          additionalProperties: true
        seo:
          $ref: "#/components/schemas/SeoMetadata"
        mediaIds:
          type: array
          items: { type: string }
        markets:
          type: array
          items: { type: string }
        revisionNumber: { type: number, multipleOf: 1, minimum: 1 }
        currentRevisionId: { type: ["string", "null"] }
        publishedRevisionId: { type: ["string", "null"] }
        scheduledAt: { type: ["string", "null"], format: date-time }
        publishedAt: { type: ["string", "null"], format: date-time }
        createdBy: { type: string }
        updatedBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DocumentInput:
      type: object
      additionalProperties: false
      required: [kind, slug, title, content, markets]
      properties:
        kind:
          $ref: "#/components/schemas/DocumentKind"
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', maxLength: 160 }
        title: { type: string, minLength: 1, maxLength: 200 }
        summary: { type: string, maxLength: 500 }
        content:
          type: object
          additionalProperties: true
        seo:
          $ref: "#/components/schemas/SeoMetadataInput"
        mediaIds:
          type: array
          items: { type: string }
        markets:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
    DocumentUpdate:
      type: object
      additionalProperties: false
      required: [revisionNumber]
      properties:
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', maxLength: 160 }
        title: { type: string, minLength: 1, maxLength: 200 }
        summary: { type: ["string", "null"], maxLength: 500 }
        content:
          type: object
          additionalProperties: true
        seo:
          $ref: "#/components/schemas/SeoMetadataInput"
        mediaIds:
          type: array
          items: { type: string }
        markets:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
        revisionNumber:
          type: number
          multipleOf: 1
          minimum: 1
          description: Optimistic concurrency version.
    SeoMetadata:
      type: object
      required: [title, description]
      properties:
        title: { type: string }
        description: { type: string }
        canonicalUrl: { type: ["string", "null"] }
        noIndex: { type: boolean }
        imageId: { type: ["string", "null"] }
    SeoMetadataInput:
      type: object
      additionalProperties: false
      required: [title, description]
      properties:
        title: { type: string, minLength: 1, maxLength: 70 }
        description: { type: string, minLength: 1, maxLength: 170 }
        canonicalUrl: { type: string }
        noIndex: { type: boolean, default: false }
        imageId: { type: string }
    DocumentRevision:
      type: object
      required: [id, documentId, number, snapshot, createdBy, createdAt]
      properties:
        id: { type: string }
        documentId: { type: string }
        number: { type: number, multipleOf: 1, minimum: 1 }
        snapshot:
          $ref: "#/components/schemas/DocumentSnapshot"
        note: { type: ["string", "null"] }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    DocumentSnapshot:
      type: object
      required: [slug, title, content, markets]
      properties:
        slug: { type: string }
        title: { type: string }
        summary: { type: ["string", "null"] }
        content:
          type: object
          additionalProperties: true
        seo:
          $ref: "#/components/schemas/SeoMetadata"
        mediaIds:
          type: array
          items: { type: string }
        markets:
          type: array
          items: { type: string }
    ReviewSubmissionInput:
      type: object
      additionalProperties: false
      properties:
        note: { type: string, maxLength: 1000 }
        reviewerIds:
          type: array
          uniqueItems: true
          items: { type: string }
    PublicationInput:
      type: object
      additionalProperties: false
      required: [revisionId]
      properties:
        revisionId: { type: string }
        publishAt: { type: ["string", "null"], format: date-time }
        note: { type: string, maxLength: 1000 }
    RollbackInput:
      type: object
      additionalProperties: false
      required: [revisionId]
      properties:
        revisionId: { type: string }
        note: { type: string, maxLength: 1000 }
    ArchiveInput:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string, maxLength: 1000 }
    DocumentPreview:
      type: object
      required: [document, previewUrl, expiresAt]
      properties:
        document:
          $ref: "#/components/schemas/DocumentSnapshot"
        previewUrl: { type: string }
        expiresAt: { type: string, format: date-time }
    DocumentPage:
      allOf:
        - $ref: "#/components/schemas/PageMetadata"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Document"
    DocumentRevisionPage:
      allOf:
        - $ref: "#/components/schemas/PageMetadata"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/DocumentRevision"

    MarketEdition:
      type: object
      required:
        - id
        - code
        - displayName
        - defaultLocale
        - fallbackMarketCode
        - fallbackLocale
        - isCanonical
        - enabled
        - createdAt
        - updatedAt
      properties:
        id: { type: string }
        code: { type: string }
        displayName: { type: string }
        defaultLocale: { type: string }
        fallbackMarketCode: { type: ["string", "null"] }
        fallbackLocale: { type: ["string", "null"] }
        isCanonical: { type: boolean }
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    MarketEditionInput:
      type: object
      additionalProperties: false
      required: [code, displayName, defaultLocale, isCanonical, enabled]
      properties:
        code: { type: string, pattern: '^[a-z][a-z0-9-]{1,15}$' }
        displayName: { type: string, minLength: 1, maxLength: 120 }
        defaultLocale: { type: string, minLength: 2, maxLength: 35 }
        fallbackMarketCode: { type: ["string", "null"], maxLength: 16 }
        fallbackLocale: { type: ["string", "null"], minLength: 2, maxLength: 35 }
        isCanonical: { type: boolean }
        enabled: { type: boolean }
    MarketEditionUpdate:
      type: object
      additionalProperties: false
      properties:
        code: { type: string, pattern: '^[a-z][a-z0-9-]{1,15}$' }
        displayName: { type: string, minLength: 1, maxLength: 120 }
        defaultLocale: { type: string, minLength: 2, maxLength: 35 }
        fallbackMarketCode: { type: ["string", "null"], maxLength: 16 }
        fallbackLocale: { type: ["string", "null"] }
        isCanonical: { type: boolean }
        enabled: { type: boolean }
    MarketEditionPage:
      allOf:
        - $ref: "#/components/schemas/PageMetadata"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/MarketEdition"

    MediaStatus:
      type: string
      enum: [pending, ready, failed]
    MediaAsset:
      type: object
      required: [id, filename, objectPath, mimeType, size, status, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string }
        filename: { type: string }
        objectPath: { type: string }
        publicUrl: { type: ["string", "null"] }
        mimeType: { type: string }
        size: { type: number, multipleOf: 1, minimum: 0 }
        width: { type: ["number", "null"], multipleOf: 1, minimum: 1 }
        height: { type: ["number", "null"], multipleOf: 1, minimum: 1 }
        checksum: { type: ["string", "null"] }
        altText: { type: ["string", "null"] }
        caption: { type: ["string", "null"] }
        credit: { type: ["string", "null"] }
        focalPoint:
          anyOf:
            - $ref: "#/components/schemas/FocalPoint"
            - type: "null"
        status:
          $ref: "#/components/schemas/MediaStatus"
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    FocalPoint:
      type: object
      required: [x, y]
      properties:
        x: { type: number, minimum: 0, maximum: 1 }
        y: { type: number, minimum: 0, maximum: 1 }
    MediaUploadInput:
      type: object
      additionalProperties: false
      required: [filename, mimeType, size]
      properties:
        filename: { type: string, minLength: 1, maxLength: 255 }
        mimeType: { type: string, minLength: 1, maxLength: 120 }
        size: { type: number, multipleOf: 1, minimum: 1, maximum: 52428800 }
        checksum: { type: string }
    MediaUpload:
      type: object
      required: [media, uploadUrl, method, headers, expiresAt]
