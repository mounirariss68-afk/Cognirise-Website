    DocumentUpdate:
      type: object
      additionalProperties: false
      required: [market, locale, revisionNumber]
      properties:
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', maxLength: 160 }
        title: { type: string, minLength: 1, maxLength: 240 }
        summary: { type: ["string", "null"], maxLength: 2000 }
        content:
          type: object
          additionalProperties: true
          description: Raw structured content preserved for document-kind validation by the shared CMS contract.
        seo:
          anyOf:
            - $ref: "#/components/schemas/SeoMetadataInput"
