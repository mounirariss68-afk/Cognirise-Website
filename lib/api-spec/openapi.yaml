      type: string
      enum: [shared, adapted, independent]
    SharedMarketOverride:
      oneOf:
        - type: object
          additionalProperties: false
          required: [op, path, value]
          properties:
            op: { type: string, enum: [set] }
            path: { type: string, minLength: 1 }
            value: {}
        - type: object
          additionalProperties: false
          required: [op, path]
          properties:
            op: { type: string, enum: [remove] }
            path: { type: string, minLength: 1 }
        - type: object
          additionalProperties: false
          required: [op, path, value]
          properties:
            op: { type: string, enum: [array-add] }
            path: { type: string, minLength: 1 }
            value:
              type: object
              additionalProperties: {}
              required: [id]
              properties: { id: { type: string } }
            afterId: { type: string }
        - type: object
          additionalProperties: false
          required: [op, path, id]
          properties:
            op: { type: string, enum: [array-remove] }
            path: { type: string, minLength: 1 }
            id: { type: string }
        - type: object
          additionalProperties: false
          required: [op, path, ids]
          properties:
            op: { type: string, enum: [array-reorder] }
            path: { type: string, minLength: 1 }
            ids: { type: array, items: { type: string }, minItems: 1 }
