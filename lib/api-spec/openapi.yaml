components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: cognirise_session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
  parameters:
    Page:
      name: page
      in: query
      schema: { type: number, multipleOf: 1, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: number, multipleOf: 1, minimum: 1, maximum: 100, default: 25 }
    Search:
      name: search
      in: query
      schema: { type: string, maxLength: 200 }
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string }
    RevisionId:
      name: revisionId
      in: path
      required: true
      schema: { type: string }
    MarketEditionId:
      name: marketEditionId
      in: path
      required: true
      schema: { type: string }
    MediaId:
      name: mediaId
      in: path
      required: true
      schema: { type: string }
    SubmissionId:
      name: submissionId
      in: path
      required: true
      schema: { type: string }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string }
    DeliveryId:
      name: deliveryId
      in: path
      required: true
      schema: { type: string }
    EditorialEditionId:
      name: editionId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    EditorialRevisionId:
      name: revisionId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    EditorialReviewRequestId:
      name: reviewRequestId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    EditorialNotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: Authentication required or failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: Authenticated user lacks permission
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: Resource state conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    PublicConfiguration:
      type: object
      additionalProperties: false
      required: [markets]
      properties:
        markets:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, displayName, defaultLocale, locales, isCanonical]
            properties:
              code: { type: string }
              displayName: { type: string }
              defaultLocale: { type: string }
              locales: { type: array, items: { type: string } }
              isCanonical: { type: boolean }
    ApiError:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code: { type: string }
        committed:
          type: boolean
          description: The state transition committed even though the confirmation response failed; reload before retrying.
        details:
          type: object
          additionalProperties: true
    NavigationSetting:
      type: object
      additionalProperties: false
      required: [id, label, parentId, order, destination, visible]
      properties:
        id: { type: string }
        label: { type: string }
        parentId: { type: ["string", "null"] }
        order: { type: number, multipleOf: 1, minimum: 0 }
        destination: { type: string }
        visible: { type: boolean }
    UpdateNavigationSetting:
      type: object
      additionalProperties: false
      required: [id, label, order, destination, visible]
      properties:
        id: { type: string }
        label: { type: string }
        parentId:
          type: ["string", "null"]
          description: Omit to inherit the registry parent; use null to explicitly place the item at the top level.
        order: { type: number, multipleOf: 1, minimum: 0 }
        destination: { type: string }
        visible: { type: boolean }
    PageAvailability:
      type: object
      additionalProperties: false
      required: [path, enabled]
      properties:
        path: { type: string }
        enabled: { type: boolean }
    NavigationSettings:
      type: object
      additionalProperties: false
      required: [items, pages, requestedMarket, requestedLocale, market, locale, usedFallback, updatedAt, version]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NavigationSetting"
        pages:
          type: array
          items:
            $ref: "#/components/schemas/PageAvailability"
        requestedMarket: { type: string }
        requestedLocale: { type: string }
        market: { type: string }
        locale: { type: string }
        usedFallback: { type: boolean }
        isConfigured: { type: boolean }
        updatedAt:
          type: ["string", "null"]
          format: date-time
        version:
