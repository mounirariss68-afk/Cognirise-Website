        createdAt: { type: string, format: date-time }
    AuditActor:
      type: object
      required: [id, name, email]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$' }
    AuditEventPage:
      allOf:
        - $ref: "#/components/schemas/PageMetadata"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/AuditEvent"

    PublishedContent:
      type: object
      required: [id, kind, slug, title, content, market, locale, revision, publishedAt, updatedAt]
      properties:
        id: { type: string }
