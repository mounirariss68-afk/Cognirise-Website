      type: object
      required: [conflictId, path, kind, message]
      properties:
        conflictId: { type: string, description: Stable sparse-operation identity used for conflict decisions; display paths are not unique. }
        path: { type: string }
        kind:
          type: string
          enum: [invalid-path, unsupported-structure, deleted-baseline-value, concurrent-value-change, array-add-conflict, array-remove-conflict, array-reorder-conflict]
        message: { type: string }
