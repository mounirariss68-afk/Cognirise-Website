openapi: 3.1.0
info:
  # Do not change the title: generated import paths depend on it.
  title: Api
  version: 0.1.0
  description: PostgreSQL-backed Cognirise API. Public CMS reads never silently fall back; an explicit UAE edition fallback is represented in delivery metadata.
servers:
  - url: /api
tags:
  - name: health
  - name: enquiries
  - name: cms
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses: { "200": { description: Healthy, content: { application/json: { schema: { $ref: "#/components/schemas/HealthStatus" } } } } }
  /enquiries:
    post:
      operationId: submitEnquiry
      tags: [enquiries]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/EnquiryInput" } } } }
      responses: { "201": { description: Accepted, content: { application/json: { schema: { $ref: "#/components/schemas/EnquiryReceipt" } } } }, "400": { $ref: "#/components/responses/Error" } }
  /newsletter-subscriptions:
    post:
      operationId: subscribeNewsletter
      tags: [enquiries]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/NewsletterSubscriptionInput" } } } }
      responses: { "201": { description: Accepted, content: { application/json: { schema: { $ref: "#/components/schemas/SubscriptionReceipt" } } } }, "400": { $ref: "#/components/responses/Error" } }
  /cms/pages/{market}/{slug}:
    get:
      operationId: getCmsPublishedPage
      tags: [cms]
      parameters: [{ $ref: "#/components/parameters/CmsMarket" }, { $ref: "#/components/parameters/CmsSlug" }, { $ref: "#/components/parameters/CmsRouteKind" }]
      responses: { "200": { description: Published page or unavailable envelope, content: { application/json: { schema: { $ref: "#/components/schemas/CmsPageEnvelope" } } } }, "400": { $ref: "#/components/responses/Error" } }
  /cms/runtime/{market}:
    get:
      operationId: getCmsRuntime
      tags: [cms]
      parameters: [{ $ref: "#/components/parameters/CmsMarket" }]
      responses: { "200": { description: Published runtime, content: { application/json: { schema: { $ref: "#/components/schemas/CmsRuntimeEnvelope" } } } }, "400": { $ref: "#/components/responses/Error" } }
  /cms/publications/{market}:
    get:
      operationId: getCmsPublishedPublications
      tags: [cms]
      parameters: [{ $ref: "#/components/parameters/CmsMarket" }]
      responses: { "200": { description: Published publications, content: { application/json: { schema: { $ref: "#/components/schemas/CmsPublicationListEnvelope" } } } }, "400": { $ref: "#/components/responses/Error" } }
  /cms/publications/{market}/{slug}:
    get:
      operationId: getCmsPublishedPublication
      tags: [cms]
      parameters: [{ $ref: "#/components/parameters/CmsMarket" }, { $ref: "#/components/parameters/CmsSlug" }]
      responses: { "200": { description: Publication or null, content: { application/json: { schema: { $ref: "#/components/schemas/CmsPublicationEnvelope" } } } }, "400": { $ref: "#/components/responses/Error" } }
  /cms/sitemap.xml:
    get:
      operationId: getCmsSitemap
      tags: [cms]
      responses: { "200": { description: "Absolute HTTPS sitemap XML for live, governed public routes", content: { application/xml: { schema: { type: string } } } }, "503": { $ref: "#/components/responses/Error" } }
  /cms/preview/exchange:
    post:
      operationId: exchangeCmsPreviewToken
      tags: [cms]
      description: "Same-origin enforced: exchanges a one-time token for a private preview cookie."
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CmsPreviewExchangeInput" } } } }
      responses: { "200": { description: Cookie issued, content: { application/json: { schema: { $ref: "#/components/schemas/CmsPreviewExchange" } } } }, "401": { $ref: "#/components/responses/Error" }, "403": { $ref: "#/components/responses/Error" } }
  /cms/preview/pages/{market}/{slug}:
    get:
      operationId: getCmsPreviewPage
      tags: [cms]
      security: [{ CmsPreviewCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CmsMarket" }, { $ref: "#/components/parameters/CmsSlug" }, { $ref: "#/components/parameters/CmsRouteKind" }]
      responses: { "200": { description: Revision-bound preview, content: { application/json: { schema: { $ref: "#/components/schemas/CmsPageEnvelope" } } } }, "401": { $ref: "#/components/responses/Error" } }
  /cms/health:
    get:
      operationId: getCmsHealth
      tags: [cms, health]
      responses: { "200": { description: Configured, content: { application/json: { schema: { $ref: "#/components/schemas/CmsHealth" } } } }, "503": { description: Unconfigured, content: { application/json: { schema: { $ref: "#/components/schemas/CmsHealth" } } } } }
  /cms/admin/access:
    get:
      operationId: getCmsAdminAccess
      tags: [cms]
      security: [{ ClerkSession: [] }]
      responses: { "200": { description: Derived PostgreSQL principal, content: { application/json: { schema: { $ref: "#/components/schemas/CmsAccessEnvelope" } } } }, "401": { $ref: "#/components/responses/Error" } }
  /cms/admin/dashboard:
    get:
      operationId: getCmsAdminDashboard
      tags: [cms]
      security: [{ ClerkSession: [] }]
      responses: { "200": { description: Assigned market counts, content: { application/json: { schema: { $ref: "#/components/schemas/CmsDashboard" } } } }, "401": { $ref: "#/components/responses/Error" } }
  /cms/admin/documents:
    get:
      operationId: listCmsAdminDocuments
      tags: [cms]
      security: [{ ClerkSession: [] }]
      responses: { "200": { description: Documents and permitted editions, content: { application/json: { schema: { $ref: "#/components/schemas/CmsDocumentListEnvelope" } } } }, "401": { $ref: "#/components/responses/Error" } }
    post:
      operationId: createCmsAdminDocument
      tags: [cms]
      security: [{ ClerkSession: [] }]
      description: Same-origin enforced. Creates a governed document and its editions from the supplied validated payload.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CmsDocumentCreateInput" } } } }
      responses: { "201": { description: Created document result, content: { application/json: { schema: { $ref: "#/components/schemas/CmsDocumentCreateResult" } } } }, "400": { $ref: "#/components/responses/Error" }, "403": { $ref: "#/components/responses/Error" }, "409": { $ref: "#/components/responses/Error" } }
  /cms/admin/documents/{documentId}:
    get:
      operationId: getCmsAdminDocument
      tags: [cms]
      security: [{ ClerkSession: [] }]
      parameters: [{ $ref: "#/components/parameters/DocumentId" }]
      responses: { "200": { description: Document and permitted editions, content: { application/json: { schema: { $ref: "#/components/schemas/CmsDocumentDetailEnvelope" } } } }, "401": { $ref: "#/components/responses/Error" }, "403": { $ref: "#/components/responses/Error" }, "404": { $ref: "#/components/responses/Error" } }
  /cms/admin/documents/{documentId}/editions/{market}:
    get:
      operationId: getCmsAdminEdition
      tags: [cms]
      security: [{ ClerkSession: [] }]
      parameters: [{ $ref: "#/components/parameters/DocumentId" }, { $ref: "#/components/parameters/CmsMarket" }]
      responses: { "200": { description: Edition and current draft revision, content: { application/json: { schema: { $ref: "#/components/schemas/CmsEditionDetailEnvelope" } } } }, "401": { $ref: "#/components/responses/Error" }, "403": { $ref: "#/components/responses/Error" }, "404": { $ref: "#/components/responses/Error" } }
    patch:
      operationId: updateCmsAdminEdition
      tags: [cms]
      security: [{ ClerkSession: [] }]
      description: Same-origin enforced. expectedVersion is required for optimistic concurrency.
      parameters: [{ $ref: "#/components/parameters/DocumentId" }, { $ref: "#/components/parameters/CmsMarket" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CmsEditionUpdateInput" } } } }
      responses: { "200": { description: Updated edition result, content: { application/json: { schema: { $ref: "#/components/schemas/CmsEditionMutationResult" } } } }, "400": { $ref: "#/components/responses/Error" }, "403": { $ref: "#/components/responses/Error" }, "409": { $ref: "#/components/responses/Error" } }
  /cms/admin/documents/{documentId}/editions/{market}/revisions:
    get:
      operationId: listCmsAdminEditionRevisions
      tags: [cms]
      security: [{ ClerkSession: [] }]
      parameters: [{ $ref: "#/components/parameters/DocumentId" }, { $ref: "#/components/parameters/CmsMarket" }]
      responses: { "200": { description: Immutable revision history, content: { application/json: { schema: { $ref: "#/components/schemas/CmsRevisionListEnvelope" } } } }, "401": { $ref: "#/components/responses/Error" }, "403": { $ref: "#/components/responses/Error" }, "404": { $ref: "#/components/responses/Error" } }
  /cms/admin/documents/{documentId}/editions/{market}/rollback:
    post:
      operationId: rollbackCmsAdminEdition
      tags: [cms]
      security: [{ ClerkSession: [] }]
      description: Same-origin enforced. expectedVersion is required for optimistic concurrency.
      parameters: [{ $ref: "#/components/parameters/DocumentId" }, { $ref: "#/components/parameters/CmsMarket" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CmsEditionRollbackInput" } } } }
      responses: { "200": { description: New draft restored from revision, content: { application/json: { schema: { $ref: "#/components/schemas/CmsEditionMutationResult" } } } }, "400": { $ref: "#/components/responses/Error" }, "403": { $ref: "#/components/responses/Error" }, "409": { $ref: "#/components/responses/Error" } }
  /cms/admin/documents/{documentId}/editions/{market}/preview:
    post:
      operationId: issueCmsAdminPreview
      tags: [cms]
      security: [{ ClerkSession: [] }]
      description: Same-origin enforced. Issues a ten-minute, one-time preview capability for an exact page revision.
      parameters: [{ $ref: "#/components/parameters/DocumentId" }, { $ref: "#/components/parameters/CmsMarket" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CmsPreviewIssueInput" } } } }
      responses: { "201": { description: Preview capability, content: { application/json: { schema: { $ref: "#/components/schemas/CmsPreviewIssuance" } } } }, "400": { $ref: "#/components/responses/Error" }, "403": { $ref: "#/components/responses/Error" }, "503": { $ref: "#/components/responses/Error" } }
  /cms/admin/revisions/{revisionId}:
    get:
      operationId: getCmsAdminRevision
      tags: [cms]
      security: [{ ClerkSession: [] }]
      parameters: [{ $ref: "#/components/parameters/RevisionId" }]
      responses: { "200": { description: Revision and edition, content: { application/json: { schema: { $ref: "#/components/schemas/CmsRevisionDetailEnvelope" } } } }, "401": { $ref: "#/components/responses/Error" }, "403": { $ref: "#/components/responses/Error" }, "404": { $ref: "#/components/responses/Error" } }
  /cms/admin/revisions/{revisionId}/diff/{againstRevisionId}:
    get:
      operationId: getCmsAdminRevisionDiff
      tags: [cms]
      security: [{ ClerkSession: [] }]
      parameters: [{ $ref: "#/components/parameters/RevisionId" }, { $ref: "#/components/parameters/AgainstRevisionId" }]
      responses: { "200": { description: Structural payload diff, content: { application/json: { schema: { $ref: "#/components/schemas/CmsRevisionDiff" } } } }, "401": { $ref: "#/components/responses/Error" }, "403": { $ref: "#/components/responses/Error" }, "404": { $ref: "#/components/responses/Error" } }
  /cms/admin/audit-events:
    get:
      operationId: listCmsAdminAuditEvents
      tags: [cms]
      security: [{ ClerkSession: [] }]
      responses: { "200": { description: Visible append-only audit events, content: { application/json: { schema: { $ref: "#/components/schemas/CmsAuditEventListEnvelope" } } } }, "401": { $ref: "#/components/responses/Error" } }
  /cms/admin/workflow/transitions:
    post:
      operationId: transitionCmsAdminWorkflow
      tags: [cms]
      security: [{ ClerkSession: [] }]
      description: Same-origin enforced. Atomically applies an authorized edition transition; expectedVersion provides optimistic concurrency.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CmsEditionTransition" } } } }
      responses: { "200": { description: Idempotent duplicate, content: { application/json: { schema: { $ref: "#/components/schemas/CmsTransitionReceipt" } } } }, "202": { description: Accepted, content: { application/json: { schema: { $ref: "#/components/schemas/CmsTransitionReceipt" } } } }, "400": { $ref: "#/components/responses/Error" }, "403": { $ref: "#/components/responses/Error" }, "409": { $ref: "#/components/responses/Error" } }
  /cms/admin/workflow/process-due:
    post:
      operationId: processDueCmsAdminWorkflow
      tags: [cms]
      security: [{ ClerkSession: [] }]
      description: Same-origin enforced. Processes due scheduled publication and expiry transitions.
      responses: { "200": { description: Processed, content: { application/json: { schema: { $ref: "#/components/schemas/CmsDueProcessingReceipt" } } } }, "202": { description: Another worker owns the lease, content: { application/json: { schema: { $ref: "#/components/schemas/CmsDueProcessingReceipt" } } } }, "401": { $ref: "#/components/responses/Error" }, "403": { $ref: "#/components/responses/Error" } }
  /cms/admin/media:
    get:
      operationId: listCmsAdminMedia
      tags: [cms]
      security: [{ ClerkSession: [] }]
      responses: { "200": { description: Assets visible to principal, content: { application/json: { schema: { $ref: "#/components/schemas/CmsMediaListEnvelope" } } } }, "401": { $ref: "#/components/responses/Error" } }
  /cms/admin/media/upload-intent:
    post:
      operationId: createCmsMediaUploadIntent
      tags: [cms]
      security: [{ ClerkSession: [] }]
      description: Same-origin enforced. Creates a private, short-lived object-storage upload intent.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CmsMediaUploadIntentInput" } } } }
      responses: { "201": { description: Upload intent, content: { application/json: { schema: { $ref: "#/components/schemas/CmsMediaUploadIntent" } } } }, "400": { $ref: "#/components/responses/Error" }, "403": { $ref: "#/components/responses/Error" }, "503": { $ref: "#/components/responses/Error" } }
  /cms/admin/media/finalize:
    post:
      operationId: finalizeCmsMediaUpload
      tags: [cms]
      security: [{ ClerkSession: [] }]
      description: Same-origin enforced. Verifies the exact uploaded object against its intent.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CmsMediaFinalizeInput" } } } }
      responses: { "200": { description: Draft asset and its first version, content: { application/json: { schema: { $ref: "#/components/schemas/CmsMediaFinalizeResult" } } } }, "400": { $ref: "#/components/responses/Error" }, "403": { $ref: "#/components/responses/Error" }, "404": { $ref: "#/components/responses/Error" }, "409": { $ref: "#/components/responses/Error" }, "503": { $ref: "#/components/responses/Error" } }
  /cms/admin/media/{mediaId}:
    patch:
      operationId: updateCmsAdminMedia
      tags: [cms]
      security: [{ ClerkSession: [] }]
      description: Same-origin enforced.
      parameters: [{ $ref: "#/components/parameters/MediaId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CmsMediaUpdateInput" } } } }
      responses: { "200": { description: Updated asset, content: { application/json: { schema: { $ref: "#/components/schemas/CmsMediaEnvelope" } } } }, "400": { $ref: "#/components/responses/Error" }, "403": { $ref: "#/components/responses/Error" }, "404": { $ref: "#/components/responses/Error" } }
    delete:
      operationId: archiveCmsAdminMedia
      tags: [cms]
      security: [{ ClerkSession: [] }]
      description: Same-origin enforced. Archives rather than removes the media record.
      parameters: [{ $ref: "#/components/parameters/MediaId" }]
      responses: { "204": { description: Archived }, "401": { $ref: "#/components/responses/Error" }, "403": { $ref: "#/components/responses/Error" }, "404": { $ref: "#/components/responses/Error" } }
  /cms/media/{mediaId}/versions/{version}:
    get:
      operationId: getCmsPublicMediaVersion
      tags: [cms]
      parameters: [{ $ref: "#/components/parameters/MediaId" }, { $ref: "#/components/parameters/MediaVersion" }]
      responses: { "200": { description: "Published, live-referenced binary asset", content: { image/jpeg: { schema: { type: string, format: binary } }, image/png: { schema: { type: string, format: binary } }, image/webp: { schema: { type: string, format: binary } }, image/gif: { schema: { type: string, format: binary } }, image/avif: { schema: { type: string, format: binary } }, application/pdf: { schema: { type: string, format: binary } } } }, "400": { $ref: "#/components/responses/Error" }, "404": { $ref: "#/components/responses/Error" } }
  /cms/editorial-assistant/runs:
    post:
      operationId: runCmsEditorialAssistant
      tags: [cms]
      security: [{ ClerkSession: [] }]
      description: Same-origin enforced. Produces a grounded suggestion only; it does not change CMS content.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CmsEditorialAssistantInput" } } } }
      responses: { "200": { description: Completed idempotent replay, content: { application/json: { schema: { $ref: "#/components/schemas/CmsEditorialAssistantResult" } } } }, "201": { description: Completed, content: { application/json: { schema: { $ref: "#/components/schemas/CmsEditorialAssistantResult" } } } }, "400": { $ref: "#/components/responses/Error" }, "401": { $ref: "#/components/responses/Error" }, "403": { $ref: "#/components/responses/Error" }, "409": { $ref: "#/components/responses/Error" }, "422": { $ref: "#/components/responses/Error" }, "429": { $ref: "#/components/responses/Error" }, "503": { $ref: "#/components/responses/Error" } }
  /cms/editorial-assistant/decisions:
    post:
      operationId: decideCmsEditorialAssistantRun
      tags: [cms]
      security: [{ ClerkSession: [] }]
      description: Same-origin enforced. Records an independent human decision and only accepted runs may edit the current draft revision.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CmsEditorialAssistantDecisionInput" } } } }
      responses: { "201": { description: Decision recorded, content: { application/json: { schema: { $ref: "#/components/schemas/CmsEditorialAssistantDecision" } } } }, "400": { $ref: "#/components/responses/Error" }, "401": { $ref: "#/components/responses/Error" }, "403": { $ref: "#/components/responses/Error" }, "409": { $ref: "#/components/responses/Error" }, "503": { $ref: "#/components/responses/Error" } }
  /cms/editorial-assistant/runs/pending:
    get:
      operationId: listCmsEditorialAssistantPendingRuns
      tags: [cms]
      security: [{ ClerkSession: [] }]
      description: Reviewer-visible, market-scoped completed assistant runs without prompt or source material.
      responses: { "200": { description: Review queue, content: { application/json: { schema: { $ref: "#/components/schemas/CmsEditorialAssistantPendingRunList" } } } }, "401": { $ref: "#/components/responses/Error" }, "403": { $ref: "#/components/responses/Error" } }
  /cms/editorial-assistant/monitoring:
    get:
      operationId: getCmsEditorialAssistantMonitoring
      tags: [cms, health]
      security: [{ ClerkSession: [] }]
      responses: { "200": { description: Redacted rolling 24-hour aggregates, content: { application/json: { schema: { $ref: "#/components/schemas/CmsEditorialAssistantMonitoring" } } } }, "401": { $ref: "#/components/responses/Error" }, "403": { $ref: "#/components/responses/Error" }, "503": { $ref: "#/components/responses/Error" } }
components:
  securitySchemes:
    ClerkSession: { type: apiKey, in: cookie, name: __session, description: Clerk session; roles and market assignments are derived server-side from PostgreSQL. }
    CmsPreviewCookie: { type: apiKey, in: cookie, name: cognirise_cms_preview, description: HttpOnly revision-bound preview session. }
  parameters:
    CmsMarket: { name: market, in: path, required: true, schema: { $ref: "#/components/schemas/CmsMarket" } }
    CmsSlug: { name: slug, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 120, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' } }
    CmsRouteKind: { name: routeKind, in: query, required: true, schema: { $ref: "#/components/schemas/CmsPageRouteKind" } }
    DocumentId: { name: documentId, in: path, required: true, schema: { $ref: "#/components/schemas/CmsId" } }
    RevisionId: { name: revisionId, in: path, required: true, schema: { type: string, format: uuid } }
    AgainstRevisionId: { name: againstRevisionId, in: path, required: true, schema: { type: string, format: uuid } }
    MediaId: { name: mediaId, in: path, required: true, schema: { type: string, minLength: 1 } }
    MediaVersion: { name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }
  responses:
    Error: { description: Request failed, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  schemas:
    ErrorResponse: { type: object, additionalProperties: false, required: [error], properties: { error: { type: string }, code: { type: string } } }
    IsoDateTime: { type: string, format: date-time }
    CmsId: { type: string, minLength: 3, maxLength: 200, pattern: '^[A-Za-z0-9._-]+$' }
    CmsMarket: { type: string, enum: [uae, ksa, turkiye, europe] }
    CmsPageRouteKind: { type: string, enum: [home, service, platform, industry, caseStudy, about, contact, landing, legal] }
    CmsPublicationState: { type: string, enum: [draft, review, approved, scheduled, published, expired, archived] }
    CmsFallbackMode: { type: string, enum: [canonical, uaeFallback, override, unavailable] }
    CmsPayload: { type: object, additionalProperties: true, description: Bounded generic JSON representation of the server's strict, versioned Zod CMS payload union. }
    CmsPage:
      type: object
      additionalProperties: false
      required: [id, revision, slug, routeKind, market, sections, updatedAt, publicationState]
      properties:
        id: { type: string, }
        revision: { type: string, }
        slug: { type: string, }
        routeKind: { $ref: "#/components/schemas/CmsPageRouteKind" }
        market: { $ref: "#/components/schemas/CmsMarket" }
        title: { type: string, }
        summary: { type: string, }
        sections: { type: array, items: { type: object, additionalProperties: true } }
        seo: { type: object, additionalProperties: true }
        updatedAt: { $ref: "#/components/schemas/IsoDateTime" }
        publicationState: { $ref: "#/components/schemas/CmsPublicationState" }
        publishAt: { $ref: "#/components/schemas/IsoDateTime" }
        expiresAt: { $ref: "#/components/schemas/IsoDateTime" }
    CmsPageMeta:
      type: object
      additionalProperties: false
      required: [requestedMarket, resolvedMarket, marketFallback, deliveryMode, source, preview]
      properties:
        requestedMarket: { $ref: "#/components/schemas/CmsMarket" }
        resolvedMarket: { type: [string, "null"], enum: [uae, ksa, turkiye, europe, null] }
        marketFallback: { type: boolean }
        deliveryMode: { $ref: "#/components/schemas/CmsFallbackMode" }
        requestedPublicationState: { $ref: "#/components/schemas/CmsPublicationState" }
        resolvedPublicationState: { $ref: "#/components/schemas/CmsPublicationState" }
        requestedPublishAt: { $ref: "#/components/schemas/IsoDateTime" }
        requestedExpiresAt: { $ref: "#/components/schemas/IsoDateTime" }
        publishAt: { $ref: "#/components/schemas/IsoDateTime" }
        expiresAt: { $ref: "#/components/schemas/IsoDateTime" }
        source: { type: string, const: postgres }
        preview: { type: boolean }
    CmsPageEnvelope: { type: object, additionalProperties: false, required: [schemaVersion, page, meta], properties: { schemaVersion: { type: integer, const: 1 }, page: { anyOf: [{ $ref: "#/components/schemas/CmsPage" }, { type: "null" }] }, meta: { $ref: "#/components/schemas/CmsPageMeta" } } }
    CmsPublication:
      type: object
      additionalProperties: true
      required: [id, revision, slug, market, kind, title, format, body, authors, topics, gated]
      properties:
        id: { type: string }
        revision: { type: string }
        slug: { type: [string, "null"] }
        market: { $ref: "#/components/schemas/CmsMarket" }
        kind: { type: string, const: publication }
        title: { type: string }
        format: { type: string, enum: [article, report, video, webinar, news, newsletter, podcast, download] }
        dek: { type: string }
        body: { type: array, items: { type: object, additionalProperties: true } }
        authors: { type: array, items: { $ref: "#/components/schemas/CmsPublicPerson" } }
        topics: { type: array, items: { type: string } }
        media: { $ref: "#/components/schemas/CmsPublicMedia" }
        download: { $ref: "#/components/schemas/CmsPublicMedia" }
        gated: { type: boolean }
