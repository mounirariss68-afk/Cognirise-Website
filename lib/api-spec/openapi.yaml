openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: First-party Cognirise website and mini CMS API.
servers:
  - url: /api
    description: Base API path
tags:
  - { name: health, description: Health operations }
  - { name: enquiries, description: Website enquiry and subscription operations }
  - { name: auth, description: First-party administrator authentication }
  - { name: dashboard, description: CMS dashboard }
  - { name: documents, description: Governed CMS documents }
  - { name: markets, description: Market editions }
  - { name: media, description: Media library }
  - { name: submissions, description: Website submissions }
  - { name: users, description: CMS users }
  - { name: audit, description: Audit trail }
  - { name: public, description: Published public content }
  - { name: analytics, description: First-party analytics and consent }
  - { name: navigation, description: Governed public navigation visibility }
paths:
  /public/readiness-assessments:
    post:
      operationId: createReadinessAssessment
      tags: [public]
      summary: Save a completed readiness decision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReadinessAssessmentInput"
      responses:
        "201":
          description: Saved readiness decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessAssessmentReceipt"
        "400":
          $ref: "#/components/responses/BadRequest"
  /public/readiness-assessments/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
    get:
      operationId: getReadinessAssessment
      tags: [public]
      summary: Reopen a saved readiness decision
      responses:
        "200":
          description: Saved readiness decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessAssessment"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteReadinessAssessment
      tags: [public]
      summary: Delete a saved readiness decision
      parameters:
        - in: header
          name: X-Delete-Token
          required: true
          schema: { type: string, minLength: 32, maxLength: 200 }
      responses:
        "204":
          description: Readiness decision deleted
        "403":
          description: Deletion permission is missing or invalid
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
        "404":
          $ref: "#/components/responses/NotFound"
  /public/configuration:
    get:
      operationId: getPublicConfiguration
      tags: [public]
      summary: Get enabled public markets and locales
      responses:
        "200":
          description: Enabled public configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicConfiguration"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /public/navigation:
    get:
      operationId: getPublicNavigationSettings
      tags: [public, navigation]
      summary: Get published header navigation visibility
      parameters:
        - { in: query, name: market, schema: { type: string, default: uae } }
        - { in: query, name: locale, schema: { type: string, default: en } }
      responses:
        "200":
          description: Navigation visibility
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NavigationSettings"
  /navigation:
    get:
      operationId: getNavigationSettings
      tags: [navigation]
      summary: Get editable header navigation visibility
      parameters:
        - { in: query, name: market, schema: { type: string, default: uae } }
        - { in: query, name: locale, schema: { type: string, default: en } }
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Navigation visibility
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NavigationSettings"
    put:
      operationId: updateNavigationSettings
      tags: [navigation]
      summary: Save navigation and page availability as a draft
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNavigationSettings"
      responses:
        "200":
          description: Updated navigation draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NavigationSettings"
  /navigation/review:
    post:
      operationId: reviewNavigationSettings
      tags: [navigation]
      summary: Submit navigation and page availability for review
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NavigationEditionSelector"
      responses:
        "200":
          description: Navigation submitted for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NavigationSettings"
  /navigation/publish:
    post:
      operationId: publishNavigationSettings
      tags: [navigation]
      summary: Publish reviewed navigation and page availability
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NavigationEditionSelector"
      responses:
        "200":
          description: Published navigation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NavigationSettings"
  /enquiries:
    post:
      operationId: submitEnquiry
      tags: [enquiries]
      summary: Submit a Cognirise website enquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnquiryInput"
      responses:
        "201":
          description: Enquiry accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnquiryReceipt"
        "400":
          $ref: "#/components/responses/BadRequest"
  /newsletter-subscriptions:
    post:
      operationId: subscribeNewsletter
      tags: [enquiries]
      summary: Subscribe to Cognirise field notes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsletterSubscriptionInput"
      responses:
        "201":
          description: Subscription accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionReceipt"
        "400":
          $ref: "#/components/responses/BadRequest"

  /auth/bootstrap:
    get:
      operationId: getAuthBootstrap
      tags: [auth]
      summary: Get initial account setup state
      responses:
        "200":
          description: Bootstrap state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthBootstrap"
    post:
      operationId: bootstrapAuth
      tags: [auth]
      summary: Create the initial administrator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthBootstrapInput"
      responses:
        "201":
          description: Administrator and session created
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Authenticate with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login result or MFA challenge
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/mfa/verify:
    post:
      operationId: verifyMfa
      tags: [auth]
      summary: Complete an MFA challenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaVerificationInput"
      responses:
        "200":
          description: Authenticated session
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/mfa/setup:
    post:
      operationId: setupMfa
      tags: [auth]
      summary: Start TOTP MFA enrollment
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        "200":
          description: Time-limited MFA provisioning details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaSetup"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/mfa/confirm:
    post:
      operationId: confirmMfa
      tags: [auth]
      summary: Confirm TOTP MFA enrollment
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaConfirmationInput"
      responses:
        "200":
          description: MFA enabled and recovery codes issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaConfirmation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/recovery:
    post:
      operationId: recoverAuth
      tags: [auth]
      summary: Authenticate using a recovery code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoveryInput"
      responses:
        "200":
          description: Authenticated session
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/password-reset:
    post:
      operationId: consumeAccessToken
      tags: [auth]
      summary: Consume a one-time invitation or password reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessTokenConsumption"
      responses:
        "204":
          description: Token consumed and password set
        "400":
          $ref: "#/components/responses/BadRequest"
        "410":
          description: Token is invalid, expired, or already consumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/password-change:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change the current user's password
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeInput"
      responses:
        "204":
          description: Password changed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        "204":
          description: Session ended
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/session:
    get:
      operationId: getSession
      tags: [auth]
      summary: Get the current session
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/csrf:
    get:
      operationId: getCsrfToken
      tags: [auth]
      summary: Issue a CSRF token for the current session
      security:
        - cookieAuth: []
      responses:
        "200":
          description: CSRF token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfToken"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /dashboard/kpis:
    get:
      operationId: getDashboardKpis
      tags: [dashboard]
      summary: Get editorial and submission KPIs
      security:
        - cookieAuth: []
      parameters:
        - name: period
          in: query
          schema:
            $ref: "#/components/schemas/DashboardPeriod"
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Dashboard KPIs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardKpis"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: List CMS documents
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - name: kind
          in: query
          schema:
            $ref: "#/components/schemas/DocumentKind"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/DocumentStatus"
        - name: market
          in: query
          schema: { type: string }
        - name: locale
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Paginated documents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createDocument
      tags: [documents]
      summary: Create a document
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentInput"
      responses:
        "201":
          description: Document created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          $ref: "#/components/responses/BadRequest"
  /documents/{documentId}:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      operationId: getDocument
      tags: [documents]
      summary: Get a document
      security:
        - cookieAuth: []
      parameters:
        - name: market
          in: query
          required: true
          schema: { type: string }
        - name: locale
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateDocument
      tags: [documents]
      summary: Update a draft document
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentUpdate"
      responses:
        "200":
          description: Document updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteDocument
      tags: [documents]
      summary: Permanently delete an eligible document
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        "204":
          description: Document deleted
        "409":
          $ref: "#/components/responses/Conflict"
  /documents/{documentId}/revisions:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      operationId: listDocumentRevisions
      tags: [documents]
      summary: List document revisions
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Paginated revisions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentRevisionPage"
  /documents/{documentId}/editions:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      operationId: listDocumentEditions
      tags: [documents]
      summary: List exact and effective document editions
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Edition matrix
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentEditionMatrix"
    post:
      operationId: createDocumentEditionOverride
      tags: [documents]
      summary: Create an exact market and locale override from effective content
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditionOverrideInput"
      responses:
        "201":
          description: Override edition created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentRevision"
  /documents/{documentId}/market-availability:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      operationId: getDocumentMarketAvailability
      tags: [documents]
      summary: Get a person's decisions for every configured market edition
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Person market availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentMarketAvailability"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /documents/{documentId}/availability:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      operationId: getDocumentAvailability
      tags: [documents]
      summary: Get the staged, reviewed, and published shared-content destinations
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Versioned document availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentAvailability"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateDocumentAvailability
      tags: [documents]
      summary: Save all shared-content destinations as a new staged version
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentAvailabilityUpdate"
      responses:
        "200":
          description: Staged destination selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentAvailability"
        "409":
          $ref: "#/components/responses/Conflict"
  /documents/{documentId}/availability/review:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    post:
      operationId: reviewDocumentAvailability
      tags: [documents]
      summary: Freeze a staged destination version for publication review
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentAvailabilityVersion"
      responses:
        "200":
          description: Reviewed destination selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentAvailability"
        "409":
          $ref: "#/components/responses/Conflict"
  /documents/{documentId}/availability/source:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    post:
      operationId: selectDocumentAvailabilitySource
      tags: [documents]
      summary: Create an explicit shared source from an exact historical revision
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentAvailabilitySourceSelection"
      responses:
        "201":
          description: Shared source selected without changing existing editions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentAvailability"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /documents/{documentId}/availability/publish:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    post:
      operationId: publishDocumentAvailability
      tags: [documents]
      summary: Publish the exact reviewed shared-content destination version
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentAvailabilityVersion"
      responses:
        "200":
          description: Published destination selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentAvailability"
        "409":
          $ref: "#/components/responses/Conflict"
  /documents/{documentId}/market-availability/{marketEditionId}:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/MarketEditionId"
    put:
      operationId: updateDocumentMarketAvailability
      tags: [documents]
      summary: Set a person's governed availability for a market edition
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketAvailabilityUpdate"
      responses:
        "200":
          description: Updated market availability decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketAvailability"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /documents/{documentId}/market-availability/{marketEditionId}/publish:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/MarketEditionId"
    post:
      operationId: publishDocumentMarketAvailability
      tags: [documents]
      summary: Publish a staged person market availability decision
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentAvailabilityVersion"
      responses:
        "204":
          description: Staged decision published
        "409":
          $ref: "#/components/responses/Conflict"
  /documents/{documentId}/revisions/{revisionId}:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/RevisionId"
    get:
      operationId: getDocumentRevision
      tags: [documents]
      summary: Get a document revision
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentRevision"
        "404":
          $ref: "#/components/responses/NotFound"
  /documents/{documentId}/submit:
    post:
      operationId: submitDocument
      tags: [documents]
      summary: Submit a document for review
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewSubmissionInput"
      responses:
        "200":
          description: Document submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "409":
          $ref: "#/components/responses/Conflict"
  /documents/{documentId}/review-comments:
    get:
      operationId: listDocumentReviewComments
      tags: [documents]
      summary: List review comments for a document
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/DocumentId"
        - name: revisionId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Review comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReviewComment"
    post:
      operationId: addDocumentReviewComment
      tags: [documents]
      summary: Add a comment to an exact revision
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewCommentInput"
      responses:
        "201":
          description: Review comment recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewComment"
  /documents/{documentId}/reject:
    post:
      operationId: rejectDocumentRevision
