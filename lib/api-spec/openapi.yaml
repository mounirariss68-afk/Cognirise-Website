        size: { type: number, multipleOf: 1, minimum: 1, maximum: 262144000 }
        checksum: { type: string }
        collection:
          $ref: "#/components/schemas/MediaCollection"
        linkedinAssetKind:
          $ref: "#/components/schemas/LinkedInAssetKind"
        campaignMetadata:
          $ref: "#/components/schemas/MediaCampaignMetadata"
        motionMetadata:
          $ref: "#/components/schemas/MotionMetadata"
    MediaUpload:
      type: object
      required: [media, uploadUrl, method, headers, expiresAt]
      properties:
        media:
          $ref: "#/components/schemas/MediaAsset"
        uploadUrl: { type: string }
        method: { type: string, enum: [PUT] }
        headers:
          type: object
          additionalProperties: { type: string }
        expiresAt: { type: string, format: date-time }
    MediaFinalizeInput:
      type: object
      additionalProperties: false
      required: [objectPath]
      properties:
        objectPath: { type: string, minLength: 1 }
        checksum: { type: string }
        altText: { type: string, maxLength: 300 }
        caption: { type: string, maxLength: 500 }
        credit: { type: string, maxLength: 200 }
        collection:
          $ref: "#/components/schemas/MediaCollection"
        linkedinAssetKind:
          $ref: "#/components/schemas/LinkedInAssetKind"
        campaignMetadata:
          $ref: "#/components/schemas/MediaCampaignMetadata"
        motionMetadata:
          $ref: "#/components/schemas/MotionMetadata"
    MediaReviewDecision:
      type: object
      additionalProperties: false
      required: [decision]
      description: Approvals require both sourceRightsApproved and accessibilityApproved; rejections do not require either confirmation.
      properties:
        decision:
          type: string
          enum: [approve, reject]
        sourceRightsApproved:
          type: boolean
          description: Publisher confirms the immutable source rights/access permission is documented and approved.
        accessibilityApproved:
          type: boolean
          description: Publisher confirms the immutable source accessibility review is complete and approved.
    MediaUpdate:
      type: object
      additionalProperties: false
      properties:
        filename: { type: string, minLength: 1, maxLength: 255 }
        altText: { type: ["string", "null"], maxLength: 300 }
        caption: { type: ["string", "null"], maxLength: 500 }
        credit: { type: ["string", "null"], maxLength: 200 }
        collection:
          $ref: "#/components/schemas/MediaCollection"
        linkedinAssetKind:
          anyOf:
            - $ref: "#/components/schemas/LinkedInAssetKind"
            - type: "null"
        campaignMetadata:
          anyOf:
            - $ref: "#/components/schemas/MediaCampaignMetadata"
            - type: "null"
        motionMetadata:
          anyOf:
            - $ref: "#/components/schemas/MotionMetadata"
            - type: "null"
        focalPoint:
          anyOf:
            - $ref: "#/components/schemas/FocalPoint"
            - type: "null"
    MediaAssetPage:
      allOf:
        - $ref: "#/components/schemas/PageMetadata"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/MediaAsset"

    SubmissionKind:
      type: string
      enum: [enquiry, newsletter]
    SubmissionStatus:
      type: string
      enum: [new, open, contacted, resolved, spam, unsubscribed]
    Submission:
      type: object
      required: [id, kind, email, market, status, sourcePage, consent, createdAt, updatedAt]
      properties:
        id: { type: string }
        kind:
          $ref: "#/components/schemas/SubmissionKind"
        name: { type: ["string", "null"] }
        email: { type: string, pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$' }
        organization: { type: ["string", "null"] }
        role: { type: ["string", "null"] }
        market: { type: string }
        processArea: { type: ["string", "null"] }
        challenge: { type: ["string", "null"] }
        status:
          $ref: "#/components/schemas/SubmissionStatus"
        ownerId: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        sourcePage: { type: string }
        consent: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SubmissionUpdate:
      type: object
      additionalProperties: false
      properties:
        status:
          $ref: "#/components/schemas/SubmissionStatus"
        ownerId: { type: ["string", "null"] }
        notes: { type: ["string", "null"], maxLength: 4000 }
    SubmissionExportInput:
      type: object
      additionalProperties: false
      required: [format]
      properties:
        format: { type: string, enum: [csv] }
        kind:
          $ref: "#/components/schemas/SubmissionKind"
        status:
          $ref: "#/components/schemas/SubmissionStatus"
        market: { type: string }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
    SubmissionExport:
      type: object
      required: [id, status, expiresAt]
      properties:
        id: { type: string }
        status: { type: string, enum: [queued, ready] }
        downloadUrl: { type: ["string", "null"] }
        expiresAt: { type: string, format: date-time }
    SubmissionPage:
      allOf:
        - $ref: "#/components/schemas/PageMetadata"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Submission"

    UserRole:
      type: string
      enum: [administrator, publisher, editor, viewer]
    UserStatus:
      type: string
      enum: [invited, active, suspended]
    User:
      type: object
      required: [id, name, email, role, status, marketCodes, mfaEnabled, mustRotate, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$' }
        role:
          $ref: "#/components/schemas/UserRole"
        status:
          $ref: "#/components/schemas/UserStatus"
        marketCodes:
          type: array
          items: { type: string, minLength: 2, maxLength: 24 }
        mfaEnabled: { type: boolean }
        mustRotate: { type: boolean }
        lastLoginAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    UserInvitationInput:
      type: object
      additionalProperties: false
      required: [name, email, role]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$', maxLength: 254 }
        role:
          $ref: "#/components/schemas/UserRole"
        marketCodes:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 2, maxLength: 24 }
    UserInvitation:
      type: object
      required: [id, user, delivery, expiresAt, createdAt]
      properties:
        id: { type: string }
        user:
          $ref: "#/components/schemas/User"
        delivery:
          type: string
          enum: [email]
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    UserUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        role:
          $ref: "#/components/schemas/UserRole"
        status:
          $ref: "#/components/schemas/UserStatus"
        marketCodes:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 2, maxLength: 24 }
    AccessTokenConsumption:
      type: object
      additionalProperties: false
      required: [token, newPassword]
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 256
        newPassword:
          type: string
          minLength: 12
          maxLength: 128
          pattern: '^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).+$'
    PasswordChangeInput:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 128
        newPassword:
          type: string
          minLength: 12
          maxLength: 128
    PasswordResetInput:
      type: object
      additionalProperties: false
      description: Requests secure email delivery to the user's registered address.
    PasswordReset:
      type: object
      required: [id, delivery, expiresAt]
      properties:
        id: { type: string }
        delivery:
          type: string
          enum: [email]
        expiresAt: { type: string, format: date-time }
    SessionRevocationInput:
      type: object
      additionalProperties: false
      properties:
        exceptCurrent: { type: boolean, default: false }
    SessionRevocation:
      type: object
      required: [revokedCount, revokedAt]
      properties:
        revokedCount: { type: number, multipleOf: 1, minimum: 0 }
        revokedAt: { type: string, format: date-time }
    UserPage:
      allOf:
        - $ref: "#/components/schemas/PageMetadata"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/User"

    AuditEvent:
      type: object
      required: [id, action, entityType, entityId, metadata, createdAt]
      properties:
        id: { type: string }
        actor:
          anyOf:
            - $ref: "#/components/schemas/AuditActor"
            - type: "null"
        action: { type: string }
        entityType: { type: string }
        entityId: { type: string }
        metadata:
          type: object
          additionalProperties: true
        ipAddress: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    AuditActor:
      type: object
      required: [id, name, email]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$' }
    AuditEventPage:
      allOf:
        - $ref: "#/components/schemas/PageMetadata"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/AuditEvent"

    PublishedContent:
      type: object
      required: [id, kind, slug, title, content, market, locale, requestedMarket, usedFallback, revision, publishedAt, updatedAt]
      properties:
        id: { type: string }
        kind:
          $ref: "#/components/schemas/DocumentKind"
        slug: { type: string }
        title: { type: string }
        summary: { type: ["string", "null"] }
        content:
          type: object
          additionalProperties: true
        seo:
          $ref: "#/components/schemas/SeoMetadata"
        media:
          type: array
          items:
            $ref: "#/components/schemas/PublicMedia"
        market: { type: string }
        locale: { type: string }
        requestedMarket: { type: string }
        usedFallback: { type: boolean }
        revision: { type: number, multipleOf: 1, minimum: 1 }
        publishedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PublicMedia:
      type: object
      required: [id, versionId, url, mimeType]
      properties:
        id: { type: string }
        versionId: { type: string }
        url: { type: string }
        mimeType: { type: string }
        width: { type: ["number", "null"], multipleOf: 1 }
        height: { type: ["number", "null"], multipleOf: 1 }
        altText: { type: ["string", "null"] }
        caption: { type: ["string", "null"] }
        credit: { type: ["string", "null"] }
    PublishedContentPage:
      allOf:
        - $ref: "#/components/schemas/PageMetadata"
        - type: object
          required: [items, market, locale, requestedMarket, usedFallback, isConfigured, configuredPagePaths]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/PublishedContent"
            market: { type: string }
            locale: { type: string }
            requestedMarket: { type: string }
            usedFallback: { type: boolean }
            isConfigured:
              type: boolean
              description: True once this content kind has an immediate publication history, including archived records.
            configuredPagePaths:
              type: array
              items: { type: string }
              description: Landing page paths with an immediate publication in their history. Draft-only pages are excluded.
    Sitemap:
      type: object
      required: [items, generatedAt]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SitemapEntry"
        generatedAt: { type: string, format: date-time }
    SitemapEntry:
      type: object
      required: [url, updatedAt]
      properties:
        url: { type: string }
        updatedAt: { type: string, format: date-time }
        changeFrequency:
          type: string
          enum: [always, hourly, daily, weekly, monthly, yearly, never]
        priority: { type: number, minimum: 0, maximum: 1 }
        alternates:
          type: array
          items:
            $ref: "#/components/schemas/SitemapAlternate"
    SitemapAlternate:
      type: object
      required: [locale, url]
      properties:
        locale: { type: string }
        url: { type: string }

    ReadinessAnswer:
      type: string
      enum: [ready, prepare, stop]
    ReadinessDecision:
      type: string
      enum: [proceed, prepare, stop]
    ReadinessAnswers:
      type: object
      additionalProperties: false
      required: [stability, access, observability, fallback, exceptions, economics]
      properties:
        stability: { $ref: "#/components/schemas/ReadinessAnswer" }
        access: { $ref: "#/components/schemas/ReadinessAnswer" }
        observability: { $ref: "#/components/schemas/ReadinessAnswer" }
        fallback: { $ref: "#/components/schemas/ReadinessAnswer" }
        exceptions: { $ref: "#/components/schemas/ReadinessAnswer" }
        economics: { $ref: "#/components/schemas/ReadinessAnswer" }
    ReadinessAssessmentInput:
      type: object
      additionalProperties: false
      required: [answers]
      properties:
        answers:
          $ref: "#/components/schemas/ReadinessAnswers"
    ReadinessAssessment:
      type: object
      required: [id, answers, decision, unresolvedConditionIds, createdAt, expiresAt]
      properties:
        id:
          type: string
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
        answers:
          $ref: "#/components/schemas/ReadinessAnswers"
        decision:
          $ref: "#/components/schemas/ReadinessDecision"
        unresolvedConditionIds:
          type: array
          items:
            type: string
            enum: [stability, access, observability, fallback, exceptions, economics]
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    ReadinessAssessmentReceipt:
      allOf:
        - $ref: "#/components/schemas/ReadinessAssessment"
        - type: object
          required: [deleteToken]
          properties:
            deleteToken: { type: string }

    AnalyticsEventInput:
      type: object
      additionalProperties: false
      required: [visitorId, sessionId, name, occurredAt, page, consentVersion]
      properties:
        visitorId: { type: string }
        sessionId: { type: string }
        name:
          type: string
          enum:
            - page_view
            - cta_click
            - value_scan_submit
            - newsletter_subscribe
            - publication_view
            - web_vital
            - service_card_activated
            - service_destination_clicked
            - case_card_open
            - case_sector_filter
            - case_visual_enlarge
            - case_detail_visit
            - case_cta
        occurredAt: { type: string, format: date-time }
        page: { type: string, maxLength: 500 }
        referrer: { type: ["string", "null"], maxLength: 1000 }
        market: { type: string, maxLength: 35 }
        properties:
          type: object
          additionalProperties: true
        consentVersion: { type: string, maxLength: 40 }
    AnalyticsReceipt:
      type: object
      required: [accepted]
      properties:
        accepted: { type: boolean }
        id: { type: ["string", "null"] }
    ConsentInput:
      type: object
      additionalProperties: false
      required: [visitorId, version, analytics, marketing]
      properties:
        visitorId: { type: string }
        version: { type: string, minLength: 1, maxLength: 40 }
        analytics: { type: boolean }
        marketing: { type: boolean }
        source: { type: string, maxLength: 100 }
    ConsentRecord:
      type: object
      required: [id, visitorId, version, analytics, marketing, recordedAt]
      properties:
        id: { type: string }
        visitorId: { type: string }
        version: { type: string }
        analytics: { type: boolean }
        marketing: { type: boolean }
        recordedAt: { type: string, format: date-time }

    PageMetadata:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page: { type: number, multipleOf: 1, minimum: 1 }
        pageSize: { type: number, multipleOf: 1, minimum: 1 }
        total: { type: number, multipleOf: 1, minimum: 0 }
        totalPages: { type: number, multipleOf: 1, minimum: 0 }
