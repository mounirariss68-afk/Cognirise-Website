      type: object
      required: [accepted]
      properties:
        accepted: { type: boolean }
        id: { type: ["string", "null"] }
    ConsentInput:
      type: object
      additionalProperties: false
      required: [visitorId, version, analytics, marketing]
      properties:
        visitorId: { type: string }
        version: { type: string, minLength: 1, maxLength: 40 }
        analytics: { type: boolean }
        marketing: { type: boolean }
        source: { type: string, maxLength: 100 }
    ConsentRecord:
      type: object
      required: [id, visitorId, version, analytics, marketing, recordedAt]
      properties:
        id: { type: string }
        visitorId: { type: string }
        version: { type: string }
        analytics: { type: boolean }
        marketing: { type: boolean }
        recordedAt: { type: string, format: date-time }

    PageMetadata:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page: { type: number, multipleOf: 1, minimum: 1 }
        pageSize: { type: number, multipleOf: 1, minimum: 1 }
        total: { type: number, multipleOf: 1, minimum: 0 }
        totalPages: { type: number, multipleOf: 1, minimum: 0 }