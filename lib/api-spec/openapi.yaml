components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: cognirise_session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
  parameters:
    Page:
      name: page
      in: query
      schema: { type: number, multipleOf: 1, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: number, multipleOf: 1, minimum: 1, maximum: 100, default: 25 }
    Search:
      name: search
      in: query
      schema: { type: string, maxLength: 200 }
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string }
    RevisionId:
      name: revisionId
      in: path
      required: true
      schema: { type: string }
    MarketEditionId:
      name: marketEditionId
      in: path
      required: true
      schema: { type: string }
    MediaId:
      name: mediaId
      in: path
      required: true
      schema: { type: string }
    SubmissionId:
      name: submissionId
      in: path
      required: true
      schema: { type: string }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: Authentication required or failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: Authenticated user lacks permission
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: Resource state conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    PublicConfiguration:
      type: object
      additionalProperties: false
      required: [markets]
      properties:
        markets:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, displayName, defaultLocale, locales, isCanonical]
            properties:
              code: { type: string }
              displayName: { type: string }
              defaultLocale: { type: string }
              locales: { type: array, items: { type: string } }
              isCanonical: { type: boolean }
    ApiError:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code: { type: string }
        details:
          type: object
          additionalProperties: true
    NavigationSetting:
      type: object
      additionalProperties: false
      required: [id, label, parentId, order, destination, visible]
      properties:
        id: { type: string }
        label: { type: string }
        parentId: { type: ["string", "null"] }
        order: { type: number, multipleOf: 1, minimum: 0 }
        destination: { type: string }
        visible: { type: boolean }
    UpdateNavigationSetting:
      type: object
      additionalProperties: false
      required: [id, label, order, destination, visible]
      properties:
        id: { type: string }
        label: { type: string }
        parentId:
          type: ["string", "null"]
          description: Omit to inherit the registry parent; use null to explicitly place the item at the top level.
        order: { type: number, multipleOf: 1, minimum: 0 }
        destination: { type: string }
        visible: { type: boolean }
    PageAvailability:
      type: object
      additionalProperties: false
      required: [path, enabled]
      properties:
        path: { type: string }
        enabled: { type: boolean }
    NavigationSettings:
      type: object
      additionalProperties: false
      required: [items, pages, requestedMarket, requestedLocale, market, locale, usedFallback, updatedAt]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NavigationSetting"
        pages:
          type: array
          items:
            $ref: "#/components/schemas/PageAvailability"
        requestedMarket: { type: string }
        requestedLocale: { type: string }
        market: { type: string }
        locale: { type: string }
        usedFallback: { type: boolean }
        isConfigured: { type: boolean }
        updatedAt:
          type: ["string", "null"]
          format: date-time
    UpdateNavigationSettings:
      type: object
      additionalProperties: false
      required: [items, pages, market, locale]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UpdateNavigationSetting"
        pages:
          type: array
          items:
            $ref: "#/components/schemas/PageAvailability"
        market: { type: string }
        locale: { type: string }
    NavigationEditionSelector:
      type: object
      additionalProperties: false
      required: [market, locale]
      properties:
        market: { type: string }
        locale: { type: string }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    EnquiryInput:
      type: object
      additionalProperties: false
      required: [name, email, organization, market, processArea, challenge, consent, sourcePage]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        email:
          type: string
          pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
          maxLength: 254
        organization: { type: string, minLength: 2, maxLength: 160 }
        role: { type: string, maxLength: 120 }
        market:
          type: string
          enum: [uae, ksa, turkiye, europe]
        processArea: { type: string, maxLength: 120 }
        challenge: { type: string, minLength: 20, maxLength: 2000 }
        consent: { type: boolean, const: true }
        sourcePage: { type: string, minLength: 1, maxLength: 200 }
        website:
          type: string
          maxLength: 0
          description: Honeypot field that must remain empty.
    EnquiryReceipt:
      type: object
      required: [id, status, createdAt]
      properties:
        id: { type: string }
        status: { type: string, enum: [received] }
        createdAt: { type: string, format: date-time }
    NewsletterSubscriptionInput:
      type: object
      additionalProperties: false
      required: [email, market, consent, sourcePage]
      properties:
        email:
          type: string
          pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
          maxLength: 254
        market:
          type: string
          enum: [uae, ksa, turkiye, europe]
        consent: { type: boolean, const: true }
        sourcePage: { type: string, minLength: 1, maxLength: 200 }
        website:
          type: string
          maxLength: 0
          description: Honeypot field that must remain empty.
    SubscriptionReceipt:
      type: object
      required: [id, status, createdAt]
      properties:
        id: { type: string }
        status: { type: string, enum: [subscribed] }
        createdAt: { type: string, format: date-time }

    AuthBootstrap:
      type: object
      required: [setupRequired]
      properties:
        setupRequired: { type: boolean }
        csrfToken: { type: ["string", "null"] }
        session:
          anyOf:
            - $ref: "#/components/schemas/Session"
            - type: "null"
    AuthBootstrapInput:
      type: object
      additionalProperties: false
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$', maxLength: 254 }
        password: { type: string, minLength: 12, maxLength: 128 }
        mfaCode: { type: string, pattern: '^[0-9]{6}$' }
    LoginInput:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$', maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 128 }
    MfaVerificationInput:
      type: object
      additionalProperties: false
      required: [challengeId, code]
      properties:
        challengeId: { type: string }
        code: { type: string, pattern: '^[0-9]{6}$' }
    MfaSetup:
      type: object
      required: [secret, provisioningUri, expiresAt]
      properties:
        secret:
          type: string
          pattern: '^[A-Z2-7]+$'
          description: Base32-encoded TOTP secret. Display once and do not persist client-side.
        provisioningUri:
          type: string
          description: otpauth provisioning URI for a TOTP authenticator.
        expiresAt: { type: string, format: date-time }
    MfaConfirmationInput:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, pattern: '^[0-9]{6}$' }
    MfaConfirmation:
      allOf:
        - $ref: "#/components/schemas/AuthResult"
        - type: object
          required: [recoveryCodes]
          properties:
            recoveryCodes:
              type: array
              minItems: 1
              items:
                type: string
                pattern: '^[A-Z0-9]{4,}(?:-[A-Z0-9]{4,})*$'
    RecoveryInput:
      type: object
      additionalProperties: false
      required: [email, recoveryCode]
      properties:
        email: { type: string, pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$', maxLength: 254 }
        recoveryCode:
          type: string
          minLength: 8
          maxLength: 64
    AuthResult:
      type: object
      required: [authenticated]
      properties:
        authenticated: { type: boolean }
        session:
          anyOf:
            - $ref: "#/components/schemas/Session"
            - type: "null"
        mfaChallenge:
          anyOf:
            - $ref: "#/components/schemas/MfaChallenge"
            - type: "null"
        csrfToken: { type: ["string", "null"] }
    MfaChallenge:
      type: object
      required: [id, expiresAt]
      properties:
        id: { type: string }
        method: { type: string, enum: [totp] }
        expiresAt: { type: string, format: date-time }
    Session:
      type: object
      required: [id, user, expiresAt]
      properties:
        id: { type: string }
        user:
          $ref: "#/components/schemas/User"
        mfaVerified: { type: boolean }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    CsrfToken:
      type: object
      required: [token, expiresAt]
      properties:
        token: { type: string }
        expiresAt: { type: string, format: date-time }

    DashboardKpis:
