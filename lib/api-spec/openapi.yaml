openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: First-party Cognirise website and mini CMS API.
servers:
  - url: /api
    description: Base API path
tags:
  - { name: health, description: Health operations }
  - { name: enquiries, description: Website enquiry and subscription operations }
  - { name: auth, description: First-party administrator authentication }
  - { name: dashboard, description: CMS dashboard }
  - { name: documents, description: Governed CMS documents }
  - { name: markets, description: Market editions }
  - { name: media, description: Media library }
  - { name: submissions, description: Website submissions }
  - { name: users, description: CMS users }
  - { name: audit, description: Audit trail }
  - { name: public, description: Published public content }
  - { name: analytics, description: First-party analytics and consent }
  - { name: navigation, description: Governed public navigation visibility }
  - { name: editorial-work, description: "Edition-scoped editorial assignments, reviews, queues, notifications, and digest preferences" }
paths:
  /public/readiness-assessments:
    post:
      operationId: createReadinessAssessment
      tags: [public]
      summary: Anonymous readiness saves are retired
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReadinessAssessmentInput"
      responses:
        "410":
          description: Anonymous readiness saves are no longer available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /public/readiness-assessments/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
    get:
      operationId: getReadinessAssessment
      tags: [public]
      summary: Reopen a saved readiness decision
      responses:
        "200":
          description: Saved readiness decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessAssessment"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteReadinessAssessment
      tags: [public]
      summary: Delete a saved readiness decision
      parameters:
        - in: header
          name: X-Delete-Token
          required: true
          schema: { type: string, minLength: 32, maxLength: 200 }
      responses:
        "204":
          description: Readiness decision deleted
        "403":
          description: Deletion permission is missing or invalid
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
        "404":
          $ref: "#/components/responses/NotFound"
  /public/configuration:
    get:
      operationId: getPublicConfiguration
      tags: [public]
      summary: Get enabled public markets and locales
      responses:
        "200":
          description: Enabled public configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicConfiguration"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /public/navigation:
    get:
      operationId: getPublicNavigationSettings
      tags: [public, navigation]
      summary: Get published header navigation visibility
      parameters:
        - { in: query, name: market, schema: { type: string, default: uae } }
        - { in: query, name: locale, schema: { type: string, default: en } }
      responses:
        "200":
          description: Navigation visibility
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NavigationSettings"
  /navigation:
    get:
      operationId: getNavigationSettings
      tags: [navigation]
      summary: Get editable header navigation visibility
      parameters:
        - { in: query, name: market, schema: { type: string, default: uae } }
        - { in: query, name: locale, schema: { type: string, default: en } }
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Navigation visibility
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NavigationSettings"
    put:
      operationId: updateNavigationSettings
      tags: [navigation]
      summary: Save navigation and page availability as a draft
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNavigationSettings"
      responses:
        "200":
          description: Updated navigation draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NavigationSettings"
  /navigation/review:
    post:
      operationId: reviewNavigationSettings
      tags: [navigation]
      summary: Optionally submit navigation and page availability for collaborator review
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NavigationEditionSelector"
      responses:
        "200":
          description: Navigation submitted for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NavigationSettings"
  /navigation/publish:
    post:
      operationId: publishNavigationSettings
      tags: [navigation]
      summary: Publish an explicitly confirmed navigation version
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishNavigationSettings"
      responses:
        "200":
          description: Published navigation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NavigationSettings"
  /enquiries:
    post:
      operationId: submitEnquiry
      tags: [enquiries]
      summary: Submit a Cognirise website enquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnquiryInput"
      responses:
        "201":
          description: Enquiry accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnquiryReceipt"
        "400":
          $ref: "#/components/responses/BadRequest"
  /newsletter-subscriptions:
    post:
      operationId: subscribeNewsletter
      tags: [enquiries]
      summary: Subscribe to Cognirise field notes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsletterSubscriptionInput"
      responses:
        "201":
          description: Subscription accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionReceipt"
        "400":
          $ref: "#/components/responses/BadRequest"

  /auth/bootstrap:
    get:
      operationId: getAuthBootstrap
      tags: [auth]
      summary: Get initial account setup state
      responses:
        "200":
          description: Bootstrap state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthBootstrap"
    post:
      operationId: bootstrapAuth
      tags: [auth]
      summary: Create the initial administrator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthBootstrapInput"
      responses:
        "201":
          description: Administrator and session created
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Authenticate with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login result or MFA challenge
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/mfa/verify:
    post:
      operationId: verifyMfa
      tags: [auth]
      summary: Complete an MFA challenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaVerificationInput"
      responses:
        "200":
          description: Authenticated session
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/mfa/setup:
    post:
      operationId: setupMfa
      tags: [auth]
      summary: Start TOTP MFA enrollment
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        "200":
          description: Time-limited MFA provisioning details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaSetup"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/mfa/confirm:
    post:
      operationId: confirmMfa
      tags: [auth]
      summary: Confirm TOTP MFA enrollment
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaConfirmationInput"
      responses:
        "200":
          description: MFA enabled and recovery codes issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaConfirmation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/recovery:
    post:
      operationId: recoverAuth
      tags: [auth]
      summary: Authenticate using a recovery code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoveryInput"
      responses:
        "200":
          description: Authenticated session
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/password-reset:
    post:
      operationId: consumeAccessToken
      tags: [auth]
      summary: Consume a one-time invitation or password reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessTokenConsumption"
      responses:
        "204":
          description: Token consumed and password set
        "400":
          $ref: "#/components/responses/BadRequest"
        "410":
          description: Token is invalid, expired, or already consumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/password-change:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change the current user's password
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeInput"
      responses:
        "204":
          description: Password changed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        "204":
          description: Session ended
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/session:
    get:
      operationId: getSession
      tags: [auth]
      summary: Get the current session
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/csrf:
    get:
      operationId: getCsrfToken
      tags: [auth]
      summary: Issue a CSRF token for the current session
      security:
        - cookieAuth: []
      responses:
        "200":
          description: CSRF token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfToken"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /dashboard/kpis:
    get:
      operationId: getDashboardKpis
      tags: [dashboard]
      summary: Get editorial and submission KPIs
      security:
        - cookieAuth: []
      parameters:
        - name: period
          in: query
          schema:
            $ref: "#/components/schemas/DashboardPeriod"
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Dashboard KPIs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardKpis"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: List CMS documents
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - name: kind
          in: query
          schema:
            $ref: "#/components/schemas/DocumentKind"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/DocumentStatus"
        - name: market
          in: query
          schema: { type: string }
        - name: locale
          in: query
          schema: { type: string }
        - name: readiness
          in: query
          description: Filter the complete eligible result set before pagination.
          schema:
            $ref: "#/components/schemas/SharedEditionReadiness"
      responses:
        "200":
          description: Paginated documents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createDocument
      tags: [documents]
      summary: Create a document
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentInput"
      responses:
        "201":
          description: Document created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          $ref: "#/components/responses/BadRequest"
  /documents/{documentId}:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      operationId: getDocument
      tags: [documents]
      summary: Get a document
      security:
        - cookieAuth: []
      parameters:
        - name: market
          in: query
          required: true
          schema: { type: string }
        - name: locale
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateDocument
      tags: [documents]
      summary: Update a draft document
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentUpdate"
      responses:
        "200":
          description: Document updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteDocument
      tags: [documents]
      summary: Permanently delete an eligible document
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        "204":
          description: Document deleted
        "409":
          $ref: "#/components/responses/Conflict"
  /documents/{documentId}/revisions:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      operationId: listDocumentRevisions
      tags: [documents]
      summary: List document revisions
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Paginated revisions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentRevisionPage"
  /documents/{documentId}/editions:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      operationId: listDocumentEditions
      tags: [documents]
      summary: List exact and effective document editions
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Edition matrix
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentEditionMatrix"
    post:
      operationId: createDocumentEditionOverride
      tags: [documents]
      summary: Create an exact market and locale override from effective content
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditionOverrideInput"
      responses:
        "201":
          description: Override edition created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentRevision"
  /editorial-work/assignments:
    get:
      operationId: listEditorialAssignments
      tags: [editorial-work]
      summary: List the assignment for an exact editorial edition
      security:
        - cookieAuth: []
      parameters:
        - name: editionId
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: mine
          in: query
          schema: { type: boolean, default: false }
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/EditorialWorkStatus"
      responses:
        "200":
          description: Editorial assignments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditorialAssignmentList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /editorial-work/editions/{editionId}/assignment:
    parameters:
      - $ref: "#/components/parameters/EditorialEditionId"
    put:
      operationId: upsertEditorialAssignment
      tags: [editorial-work]
      summary: Upsert the active assignment for an exact editorial edition
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditorialAssignmentInput"
      responses:
        "200":
          description: Assignment saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditorialAssignmentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: clearEditorialAssignment
      tags: [editorial-work]
      summary: Clear the active assignment for an exact editorial edition
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        "204":
          description: Assignment cleared
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /editorial-work/editions/{editionId}/assignees:
    parameters:
      - $ref: "#/components/parameters/EditorialEditionId"
    get:
      operationId: listEditorialAssignees
      tags: [editorial-work]
      summary: List active users eligible for an exact editorial edition
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Eligible editors and reviewers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditorialAssigneeList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /editorial-work/revisions/{revisionId}/request-review:
    parameters:
      - $ref: "#/components/parameters/EditorialRevisionId"
    post:
      operationId: requestEditorialReview
      tags: [editorial-work]
      summary: Request review of the current submitted revision
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditorialReviewRequestInput"
      responses:
        "200":
          description: Existing review request reused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditorialReviewRequestResponse"
        "201":
          description: Review request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditorialReviewRequestResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /editorial-work/review-requests/{reviewRequestId}/decision:
    parameters:
      - $ref: "#/components/parameters/EditorialReviewRequestId"
    post:
      operationId: decideEditorialReview
      tags: [editorial-work]
      summary: Approve or reject an exact revision review request
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditorialReviewDecisionInput"
      responses:
        "200":
          description: Review request decided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditorialReviewRequestResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /editorial-work/my:
    get:
      operationId: getMyEditorialWork
      tags: [editorial-work]
      summary: Get the caller's editorial work queue
      security:
        - cookieAuth: []
      parameters:
        - name: includeUnassigned
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Editorial work queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditorialQueueResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /editorial-work/team:
    get:
      operationId: getEditorialTeamWork
      tags: [editorial-work]
      summary: Get the publisher or administrator team queue
      security:
        - cookieAuth: []
      parameters:
        - name: market
          in: query
          schema: { type: string }
        - name: assigneeId
          in: query
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/EditorialWorkStatus"
        - name: includeUnassigned
          in: query
          schema: { type: boolean, default: true }
      responses:
        "200":
          description: Team editorial work queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditorialQueueResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /editorial-work/notifications:
    get:
      operationId: listEditorialNotifications
      tags: [editorial-work]
      summary: List the caller's in-app editorial notifications
      security:
        - cookieAuth: []
      parameters:
        - name: unreadOnly
          in: query
          schema: { type: boolean, default: false }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
