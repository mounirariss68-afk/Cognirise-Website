        - name
        - email
        - organization
        - market
        - processArea
        - challenge
        - consent
        - sourcePage
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
          maxLength: 254
        organization:
          type: string
          minLength: 2
          maxLength: 160
        role:
          type: string
          maxLength: 120
        market:
          type: string
          enum: [uae, ksa, turkiye, europe]
        processArea:
          type: string
          maxLength: 120
        challenge:
          type: string
          minLength: 20
          maxLength: 2000
        consent:
          type: boolean
          const: true
        sourcePage:
          type: string
          minLength: 1
          maxLength: 200
        website:
          type: string
          maxLength: 0
          description: Honeypot field that must remain empty.
    EnquiryReceipt:
      type: object
      required: [id, status, createdAt]
      properties:
        id:
          type: string
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
        status:
          type: string
          enum: [received]
        createdAt:
          $ref: "#/components/schemas/IsoDateTime"
    NewsletterSubscriptionInput:
